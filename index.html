<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kameti Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#059669;--primary-d:#047857;--primary-l:#d1fae5;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--danger:#dc2626;--warn:#d97706;--info:#2563eb;
  --radius:14px;--shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-weight:800;line-height:1.25}
h1{font-size:23px}h2{font-size:19px;margin-bottom:12px}h3{font-size:16px;margin-bottom:8px}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;outline:none;transition:.15s;margin-bottom:10px;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:12px;font-weight:700;cursor:pointer;transition:.15s;width:100%}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.2)}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.mini{padding:6px 11px;font-size:12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer;transition:.15s}
.mini.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.mini.danger{background:#fef2f2;border-color:#fecaca;color:var(--danger)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.tag{background:var(--primary-l);color:var(--primary-d);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;vertical-align:middle}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#059669 0%,#047857 45%,#065f46 100%)}
.auth-card{background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.brand{font-size:48px;text-align:center;line-height:1;margin-bottom:10px}
.auth-card h1{text-align:center;margin-bottom:4px}
.auth-card>p{text-align:center;margin-bottom:24px;font-size:14px}
.hint{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:14px;text-align:center;font-weight:600}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.topbar-inner{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-sm{font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--primary-d)}
.nav{display:flex;gap:6px}
.nav button{background:transparent;border:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s}
.nav button.on{background:var(--primary-l);color:var(--primary-d)}
.nav .logout{color:var(--danger)}

/* LAYOUT */
.container{max-width:920px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid #eef2f6}
.card.narrow{max-width:480px;margin-left:auto;margin-right:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:22px}

/* KAMETI CARD */
.kameti-card{cursor:pointer;transition:.2s;border-left:4px solid var(--primary)}
.kameti-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.kameti-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3>div{display:flex;flex-direction:column;gap:2px}
.grid3 .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.grid3 b{font-size:15px;font-weight:800}

/* BADGES */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.active,.badge.paid,.badge.approved{background:var(--primary-l);color:var(--primary-d)}
.badge.completed{background:#dbeafe;color:#1e40af}
.badge.unpaid,.badge.submitted,.badge.pending{background:#fef3c7;color:#92400e}
.badge.rejected{background:#fee2e2;color:#991b1b}
.badge.admin{background:#ede9fe;color:#6d28d9}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:16px;border:1px solid #eef2f6;box-shadow:var(--shadow)}
.stat .l{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:4px}
.stat .v{font-size:20px;font-weight:800}
.stat .v.green{color:var(--primary-d)}

/* PROGRESS */
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;background:linear-gradient(90deg,#10b981,#059669);border-radius:20px;transition:.4s}

/* CODE BOX */
.code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0fdf4;border:1.5px dashed #86efac;border-radius:12px;padding:14px 16px;margin-top:12px}
.code-box .c{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;letter-spacing:4px;color:var(--primary-d)}

/* TABS */
.tabs2{display:flex;gap:6px;background:#fff;border-radius:14px;padding:6px;margin-bottom:16px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:1;min-width:80px;padding:10px 8px;border:none;background:transparent;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.tabs2 button.on{background:var(--primary);color:#fff}

/* ROUNDS */
.round{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
.round.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.round-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:.15s}
.round-head:hover{background:#f8fafc}
.round-no{width:36px;height:36px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--muted);flex-shrink:0}
.round.current .round-no{background:var(--primary);color:#fff}
.round-info{flex:1;min-width:0}
.round-info b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.round-amt{font-weight:800;font-size:14px;color:var(--primary-d);white-space:nowrap}
.round-body{display:none;padding:0 16px 14px;border-top:1px solid #f1f5f9}
.round-body.open{display:block}
.contrib{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc;flex-wrap:wrap}
.contrib:last-child{border-bottom:none}
.contrib.mine{background:#f0fdf4;margin:0 -16px;padding:10px 16px}
.c-name{flex:1;font-size:14px;font-weight:700;min-width:90px}
.c-act{display:flex;gap:6px;flex-wrap:wrap}

/* MEMBERS */
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.member:last-child{border-bottom:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.member .m-info{flex:1;min-width:110px}
.member .m-info b{display:block;font-size:15px}
.member-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.member-row input{margin-bottom:0;flex:1}
.member-row .mini{flex-shrink:0}
.online-dot{width:8px;height:8px;background:var(--primary);border-radius:50%;display:inline-block;box-shadow:0 0 6px var(--primary);margin-left:4px}

/* SPIN */
.spin-card{background:linear-gradient(180deg,#fff 0%,#f0fdf4 100%);border:1px solid #d1fae5}
.wheel-wrap{position:relative;width:290px;height:290px;margin:24px auto}
.wheel{width:100%;height:100%;position:relative;border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.18),0 0 0 6px #fff,0 0 0 10px #fbbf24}
.wheel-rotate{width:100%;height:100%;position:relative;border-radius:50%;transition:transform 0s;transform:rotate(0deg);will-change:transform}
.wheel-face{position:absolute;inset:0;border-radius:50%}
.wheel-center{position:absolute;top:50%;left:50%;width:60px;height:60px;margin:-30px 0 0 -30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:5;border:4px solid #fbbf24}
.wheel-spoke{position:absolute;top:50%;left:50%;width:0;transform-origin:0 0;pointer-events:none;z-index:2}
.wheel-spoke span{position:absolute;bottom:10px;left:0;transform:translateX(-50%);font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);white-space:nowrap}
.wheel-pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#dc2626;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));z-index:10}
.spin-history{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9}
.sh-round{width:32px;height:32px;border-radius:50%;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.sh-info{flex:1}.sh-info b{display:block;font-size:14.5px}
.sh-amt{font-weight:800;color:var(--primary-d);font-size:14px}

/* ONLINE PRESENCE */
.presence-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;scrollbar-width:none}
.presence-bar::-webkit-scrollbar{display:none}
.p-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f8fafc;border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.p-chip.online{background:var(--primary-l);color:var(--primary-d);border-color:var(--primary-l)}

/* MODAL / TOAST */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:500;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger)}
.toast.success{background:var(--primary)}

/* CELEBRATION */
.celebration{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at center,#F59E0B,#B45309);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;overflow:hidden}
.cel-content{position:relative;z-index:2;animation:popIn .8s cubic-bezier(.34,1.56,.64,1);width:100%}
@keyframes popIn{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.cel-emoji{font-size:90px;animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-20px) scale(1.1)}}
.cel-title{font-size:22px;font-weight:800;letter-spacing:6px;margin:20px 0 10px;text-transform:uppercase}
.cel-name{font-size:48px;font-weight:900;margin:10px 0;line-height:1.1}
.cel-msg{font-size:22px;font-weight:700;margin-bottom:25px}
.cel-amount{font-size:28px;font-weight:800;background:rgba(255,255,255,.15);padding:15px 35px;border-radius:40px;border:2px solid rgba(255,255,255,.3);display:inline-block}
.confetti{position:absolute;width:12px;height:12px;top:-20px;animation:fall linear forwards;z-index:1;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(1080deg);opacity:0}}

/* LOADING SCREEN */
#loading{position:fixed;inset:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;z-index:9999;color:#059669;font-weight:800;flex-direction:column;transition:opacity .3s}
.spinner{width:44px;height:44px;border:4px solid #d1fae5;border-top-color:#059669;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  Loading Kameti Pro...
</div>

<div id="app"></div>

<script>
window.__booted = false;
window.__bootTimer = setTimeout(() => {
  if (!window.__booted) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center; padding:20px; max-width:300px;">
        <h2 style="color:#dc2626; margin-bottom:10px;">⚠️ Loading Timeout</h2>
        <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Internet check karein. Agar issue barqarar rahe to page reload karein.</p>
        <button onclick="location.reload()" style="background:#059669; color:#fff; border:none; padding:12px 24px; border-radius:8px; font-weight:700; cursor:pointer;">🔄 Retry</button>
      </div>`;
  }
}, 8000);

(function loadSupabase() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
  ];
  let i = 0;
  function tryLoad() {
    if (i >= urls.length) {
      document.getElementById('loading').innerHTML = `<h2 style="color:#dc2626">Network Error</h2><p>Supabase load nahi ho saka.</p><button onclick="location.reload()">Retry</button>`;
      return;
    }
    let s = document.createElement('script');
    s.src = urls[i];
    s.onload = () => { if(window.supabase) startApp(); else tryLoad(); };
    s.onerror = () => { i++; tryLoad(); };
    document.head.appendChild(s);
  }
  tryLoad();
})();

const SUPABASE_URL = 'https://uxhejibemixdwedmpmri.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VJEJOGE-OjrWxObF6wE5wQ_T926zRp8';
const SUPER_ADMIN_PHONE = '03176407904';
const SPIN_DURATION = 20000; 
const CELEBRATION_DURATION = 10000;

let supabase = null;
let currentProfile = null;
let kametis = [];
let activeKameti = null;
let view = { name:'dashboard', kametiId:null, tab:'overview' };
let modalHTML = null;
let onlineMembers = [];
let isSpinning = false;
let spinMode = 'real';
let presenceChannel = null;
let spinChannel = null;
const openRounds = new Set();
const celebratedRounds = new Set();

const money = n => 'Rs ' + Number(n||0).toLocaleString('en-US');
const todayISO = () => new Date().toISOString().slice(0,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shortName = s => { s = String(s||''); return s.length > 10 ? s.slice(0,9)+'…' : s; };
function fmtDate(s){ if(!s) return ''; const d = new Date(s+'T00:00:00'); return isNaN(d.getTime())?s:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function toast(msg,type){ const el=document.createElement('div'); el.className='toast '+(type||''); el.textContent=msg; document.body.appendChild(el); requestAnimationFrame(()=>el.classList.add('show')); setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2600); }
function openModal(h){ modalHTML=h; render(); }
function closeModal(e){ if(e&&e.target!==e.currentTarget) return; modalHTML=null; render(); }
function go(name,kametiId){ view={name,kametiId:kametiId||null,tab:'overview'}; openRounds.clear(); window.scrollTo({top:0,behavior:'smooth'}); render(); }
function setTab(t){ view.tab=t; render(); }
function toggleRound(id){ openRounds.has(id)?openRounds.delete(id):openRounds.add(id); render(); }
function roundContribution(k){ return k.frequency==='daily'?k.amount*30:k.amount; }
function poolAmount(k){ const n=k.members.filter(m=>m.status==='approved').length; return roundContribution(k)*n; }

async function startApp() {
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let session = null;
    try {
      const { data } = await supabase.auth.getSession();
      session = data.session;
    } catch(e) { console.warn('Session error:', e); }

    if (session) {
      try {
        await loadProfile(session.user.id);
        if (currentProfile) await loadKametis();
      } catch(e) { console.warn('Profile load error:', e); currentProfile = null; }
    }
  } catch(err) {
    console.error('Init fatal:', err);
  } finally {
    window.__booted = true;
    clearTimeout(window.__bootTimer);
    document.getElementById('loading').style.display = 'none';
    render();
  }
}

async function loadProfile(userId) {
  let { data, error } = await supabase.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(error) throw error;
  
  if(!data) {
    let { data: userData } = await supabase.auth.getUser();
    let meta = userData.user.user_metadata || {};
    let p = meta.phone || userData.user.email.split('@')[0];
    let n = meta.name || p;
    
    p = p.replace(/[\s\-()]/g, '');
    if(p.startsWith('+92')) p = '0' + p.slice(3);
    if(p.startsWith('92') && p.length > 10) p = '0' + p.slice(2);
    if(p.length === 10 && !p.startsWith('0')) p = '0' + p;
    
    let role = (p === SUPER_ADMIN_PHONE) ? 'superadmin' : 'member';
    
    // Try to insert profile. If it fails, fetch existing.
    let { data: newP, error: insErr } = await supabase.from('profiles').insert({
      id: userId, phone: p, name: n, role: role
    }).select().maybeSingle();
    
    if(insErr || !newP) {
      let { data: existP, error: fetchErr } = await supabase.from('profiles').select('*').eq('phone', p).maybeSingle();
      if(existP) currentProfile = existP;
      else throw new Error(insErr ? insErr.message : 'Profile creation failed. Try again.');
    } else {
      currentProfile = newP;
    }
  } else {
    currentProfile = data;
  }
}

async function loginWithPhone() {
  const phoneInput = document.getElementById('l_phone').value.trim();
  const nameInput = document.getElementById('l_name').value.trim();
  
  let p = phoneInput.replace(/[\s\-()]/g, '');
  if(p.startsWith('+92')) p = '0' + p.slice(3);
  if(p.startsWith('92') && p.length > 10) p = '0' + p.slice(2);
  if(p.length === 10 && !p.startsWith('0')) p = '0' + p;
  
  if(p.length !== 11 || !p.startsWith('03')) return toast('Sahi phone number likhein', 'error');

  const email = p + '@kameti.local';
  const password = 'km_' + p + '_sec';
  const btn = document.getElementById('btn_login');
  btn.disabled = true; btn.textContent = 'Wait...';

  try {
    let { data: authData, error: authErr } = await supabase.auth.signInWithPassword({ email, password });
    if(authErr) {
      // New user signup
      let { data: signupData, error: signupErr } = await supabase.auth.signUp({
        email, password, options: { data: { phone: p, name: nameInput || p } }
      });
      if(signupErr) throw signupErr;
      
      if(!signupData.session) {
        await new Promise(r => setTimeout(r, 1000));
        let { data: retryData, error: retryErr } = await supabase.auth.signInWithPassword({ email, password });
        if(retryErr) throw new Error('Login fail. Supabase dashboard mein Confirm Email off karein.');
        authData = retryData;
      } else authData = signupData;
    }
    
    await loadProfile(authData.user.id);
    await loadKametis();
    go('dashboard');
    toast('Welcome!', 'success');
  } catch(err) { 
    console.error('Login error:', err);
    toast(err.message, 'error'); 
  }
  finally { btn.disabled = false; btn.textContent = 'Login / Sign Up'; }
}

async function logout() {
  if(!confirm('Logout?')) return;
  if(presenceChannel) supabase.removeChannel(presenceChannel);
  if(spinChannel) supabase.removeChannel(spinChannel);
  await supabase.auth.signOut();

}

async function loadKametiDetail(id) {
  let { data: k, error } = await supabase.from('kametis').select('*').eq('id',id).maybeSingle();
  if(error) throw error;
  if(!k) throw new Error('Kameti not found');
  
  let { data: m } = await supabase.from('members').select('*').eq('kameti_id',id);
  let { data: r } = await supabase.from('rounds').select('*').eq('kameti_id',id).order('index');
  let { data: c } = await supabase.from('contributions').select('*').in('round_id',(r||[]).map(x=>x.id));
  
  activeKameti = { ...k, members: m||[], rounds: (r||[]).map(rr=>({...rr, contributions: (c||[]).filter(cc=>cc.round_id===rr.id)})) };
  return activeKameti;
}

async function createKameti(e) {
  e.preventDefault();
  const name = document.getElementById('k_name').value.trim();
  const freq = document.getElementById('k_freq').value;
  const amount = parseInt(document.getElementById('k_amt').value);
  const months = parseInt(document.getElementById('k_months').value);
  const spinDay = parseInt(document.getElementById('k_spinday').value);
  const startDate = document.getElementById('k_date').value;
  const self = document.getElementById('k_self').checked;

  let members = [];
  if(self) members.push({ name: currentProfile.name, phone: currentProfile.phone, user_id: currentProfile.id });
  document.querySelectorAll('.member-row').forEach(row => {
    const n = row.querySelector('.mr-name').value.trim();
    const p = row.querySelector('.mr-phone').value.trim().replace(/\s/g,'');
    if(n) members.push({ name: n, phone: p });
  });
  
  const seen = new Set();
  members = members.filter(m => { if(m.phone && seen.has(m.phone)) return false; if(m.phone) seen.add(m.phone); return true; });
  if(members.length < 2) return toast('Kam az kam 2 members chahiye', 'error');

  try {
    const code = Math.random().toString(36).substring(2,8).toUpperCase();
    // 1. Insert Kameti
    let { data: k, error: kErr } = await supabase.from('kametis').insert({
      name, code, owner_id: currentProfile.id, admin_ids: [currentProfile.id],
      frequency: freq, amount, total_months: months, spin_day: spinDay,
      start_date: startDate, status: 'active', admin_included: self
    }).select().maybeSingle();
    
    if(kErr || !k) throw new Error(kErr ? kErr.message : 'Failed to create kameti');

    // 2. Insert Members
    let { error: mErr } = await supabase.from('members').insert(members.map(m => ({
      kameti_id: k.id, user_id: m.user_id || null, name: m.name, phone: m.phone, status: 'approved'
    })));
    if(mErr) throw mErr;

    // 3. Fetch Inserted Members
    let { data: insM } = await supabase.from('members').select('id').eq('kameti_id', k.id);

    // 4. Insert Rounds
    let rounds = [];
    const parts = startDate.split('-').map(Number);
    for(let i = 0; i < months; i++) {
      const d = new Date(parts[0], parts[1]-1+i, Math.min(spinDay, 28));
      rounds.push({ kameti_id: k.id, index: i+1, date: d.toISOString().slice(0,10), spin_state: 'pending' });
    }
    let { data: insR, error: rErr } = await supabase.from('rounds').insert(rounds).select();
    if(rErr) throw rErr;

    // 5. Insert Contributions
    let contribs = [];
    insR.forEach(r => {
      insM.forEach(m => {
        contribs.push({ round_id: r.id, member_id: m.id, status: 'unpaid' });
      });
    });
    if(contribs.length) await supabase.from('contributions').insert(contribs);

    toast('Kameti ban gayi!', 'success');
    await loadKametis();
    go('dashboard');
  } catch(err) { toast(err.message, 'error'); }
}

  const approved = k.members.filter(m=>m.status==='approved');
  if(!approved.length) return '<div class="card empty"><h3>Pehle members add karein</h3></div>';

  const pendingRound = k.rounds.find(r=>!r.receiver_member_id);

  let onlineCount = approved.filter(m => m.user_id && onlineMembers.includes(m.user_id)).length;

  }).join('')}</div></div>`;

  if(pendingRound) {
    if(admin && !isSpinning) {
      html += `<div class="card"><div class="tabs2" style="margin-bottom:0">
        <button class="${spinMode==='real'?'on':''}" onclick="spinMode='real';render()">👥 Real Spin</button>
        <button class="${spinMode==='demo'?'on':''}" onclick="spinMode='demo';render()">🎬 Demo Spin</button>
      </div></div>`;
    }

    let pool = approved.filter(m=>!k.won_member_ids.includes(m.id));
    let display = pool.length ? pool : approved;
    
    html += `<div class="card spin-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <span class="badge active">Round #${pendingRound.index} / ${k.rounds.length}</span>
        <span class="small muted">${fmtDate(pendingRound.date)}</span>
      </div>
      <div class="wheel-wrap">${wheelHTML(display)}<div class="wheel-pointer">▼</div></div>`;
      
    if(isSpinning) html += `<div class="spin-status">⏳ Spin ho rahi hai (20s)...</div>`;
    else if(admin) html += `<button class="btn primary" onclick="startSpin('${k.id}','${pendingRound.id}')">🎡 Spin Karein</button>`;
    else html += `<div class="warnbox" style="text-align:center">Admin spin karega — ${fmtDate(pendingRound.date)}</div>`;
    
    html += `</div>`;
  } else {
    html += `<div class="card empty"><div class="ico">🏁</div><h3>Sab spins mukammal!</h3></div>`;
  }

  if(doneRounds.length) {
    html += `<div class="card"><h3>📜 Kameti History</h3>`;

        <div class="sh-amt">${money(poolAmt)}</div></div>`;
    });
    html += `</div>`;
  }
  return html;
}

function wheelHTML(members) {
  if(!members.length) return '<div style="padding:40px;text-align:center">No members</div>';
  const n = members.length, seg = 360/n;
  const colors = ['#059669','#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#10b981','#6366f1','#f43f5e'];
  const stops = members.map((m,i)=>colors[i%colors.length]+' '+(i*seg)+'deg '+((i+1)*seg)+'deg').join(', ');
  
  const spokes = members.map((m,i)=>{
    const a = i*seg + seg/2;
    return `<div class="wheel-spoke" style="transform:rotate(${a-180}deg);height:122px"><span>${esc(shortName(m.name))}</span></div>`;
  }).join('');

  return `<div class="wheel"><div class="wheel-rotate" id="wheel-rotate">
    <div class="wheel-face" style="background:conic-gradient(${stops})"></div>${spokes}
    <div class="wheel-center">🎡</div>
  </div></div>`;
}

async function startSpin(kid, rid) {
  if(isSpinning) return;
  const k = activeKameti;
  
  if(spinMode === 'demo') {
    let pool = k.members.filter(m=>m.status==='approved'&&!k.won_member_ids.includes(m.id));
    let display = pool.length ? pool : k.members.filter(m=>m.status==='approved');
    let winner = display[Math.floor(Math.random()*display.length)];
    let idx = display.indexOf(winner);
    let seg = 360/display.length;
    let target = 360*8 + (360 - (idx*seg + seg/2));
    
    isSpinning = true; render();
    setTimeout(()=>{
      let el = document.getElementById('wheel-rotate');
      if(el) { el.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(.15,.7,.25,1)`; el.style.transform = `rotate(${target}deg)`; }
    }, 100);
    
    setTimeout(()=>{
      isSpinning = false; spinMode = 'real';
      showCelebration(winner.name, poolAmount(k));
      render();
    }, SPIN_DURATION);
    return;
  }
  
  try {
    let { data, error } = await supabase.rpc('spin_round', { p_round_id: rid });
    if(error) throw error;
    
    isSpinning = true; render();
    let seg = 360/data.total;
    let target = 360*8 + (360 - (data.winner_index*seg + seg/2));
    
    if(spinChannel) spinChannel.send({ type:'broadcast', event:'spin_start', payload:{ target, duration: SPIN_DURATION, roundId: rid } });
    
    setTimeout(()=>{
      let el = document.getElementById('wheel-rotate');
      if(el) { el.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(.15,.7,.25,1)`; el.style.transform = `rotate(${target}deg)`; }
    }, 100);
    
    setTimeout(async ()=>{
      try {
        await supabase.rpc('complete_spin', { p_round_id: rid });
        if(spinChannel) spinChannel.send({ type:'broadcast', event:'spin_result', payload:{ winnerName: data.winner_name, poolAmt: poolAmount(k), roundId: rid } });
        
        isSpinning = false;
        if(!celebratedRounds.has(rid)) { celebratedRounds.add(rid); showCelebration(data.winner_name, poolAmount(k)); }
        await loadKametiDetail(kid); render();
      } catch(e) { isSpinning = false; toast(e.message,'error'); render(); }
    }, SPIN_DURATION);
    
  } catch(e) { toast(e.message,'error'); }
}

function showCelebration(name, amt) {
  let ov = document.createElement('div');
  ov.className = 'celebration';
  ov.innerHTML = `<div class="cel-content">
    <div class="cel-emoji">🎉</div><div class="cel-title">KHUSH NASEEM</div>
    <div class="cel-name">${esc(name)}</div>
    <div class="cel-msg">Mubarak Ho<br><span style="font-size:16px">Aap ki kameti nikal aayi hai</span></div>
    <div class="cel-amount">${money(amt)}</div>
  </div>`;
  document.body.appendChild(ov);
  
  for(let i=0;i<70;i++){
    let c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100+'%';
    c.style.background = ['#FBBF24','#F59E0B','#EF4444','#3B82F6','#10B981','#8B5CF6','#fff'][i%7];
    c.style.animationDuration = (2+Math.random()*2)+'s';
    c.style.width = (6+Math.random()*8)+'px';
    c.style.height = (6+Math.random()*8)+'px';
    ov.appendChild(c);
  }
  
  try {
    let u = new SpeechSynthesisUtterance(name + ' آپ کو مبارک ہو، آپ کی کمیٹی نکل آئی ہے');
    u.lang = 'ur-PK'; u.rate = 0.85; speechSynthesis.speak(u);
  } catch(e) {}
  
  setTimeout(()=>{ ov.style.opacity='0'; ov.style.transition='opacity .5s'; setTimeout(()=>ov.remove(),500); }, CELEBRATION_DURATION);
}

function paymentsTab(k, admin) {
  if(!k.rounds.length) return '<div class="card empty">Koi round nahi</div>';
  const currentRound = k.rounds.find(r=>!r.receiver_member_id);
  let html = `<div class="card"><h3>💳 Payments</h3><p class="small muted">Har round ke contributions yahan dikhte hain.</p></div>`;
  
  k.rounds.slice().reverse().forEach(r => {
    const rec = k.members.find(m=>m.id===r.receiver_member_id);
    const paid = r.contributions.filter(c=>c.status==='paid').length;
    const tot = r.contributions.length;
    const isOpen = openRounds.has(r.id);
    const isCurr = currentRound && currentRound.id === r.id;
    
    html += `<div class="round ${isCurr?'current':''}">
      <div class="round-head" onclick="toggleRound('${r.id}')">
        <div class="round-no">${r.index}</div>
        <div class="round-info"><b>${rec?'🏆 '+esc(rec.name):'⏳ Spin pending'}</b><span class="small muted">${fmtDate(r.date)} • ${paid}/${tot} paid</span></div>
        <div class="round-amt">${money(poolAmount(k))}</div>
      </div>
      <div class="round-body ${isOpen?'open':''}">
        ${r.contributions.map(c=>contribRow(k,r,c,admin)).join('')}
      </div>
    </div>`;
  });
  return html;
}

function contribRow(k, r, c, admin) {
  const m = k.members.find(x=>x.id===c.member_id);
  const mine = m && m.user_id === currentProfile.id;
  let actions = '';
  
  if(admin) {
    if(c.status==='unpaid') actions = `<button class="mini primary" onclick="markPaid('${k.id}','${r.id}','${c.member_id}')">Mark Paid</button>`;
    else if(c.status==='submitted') actions = `<button class="mini primary" onclick="markPaid('${k.id}','${r.id}','${c.member_id}')">Confirm</button><button class="mini" onclick="unmarkPaid('${k.id}','${r.id}','${c.member_id}')">Reject</button>`;
    else actions = `<button class="mini" onclick="unmarkPaid('${k.id}','${r.id}','${c.member_id}')">Undo</button>`;
  } else if(mine) {
    if(c.status==='unpaid') actions = `<button class="mini primary" onclick="payModal('${k.id}','${r.id}','${c.member_id}')">Pay Now</button>`;
    else if(c.status==='submitted') actions = `<span class="small muted">✔ Pending</span>`;
    else actions = `<span class="small" style="color:var(--primary-d);font-weight:800">✔ Paid</span>`;
  }

  return `<div class="contrib ${mine?'mine':''}">
    <div class="c-name">${esc(m?m.name:'?')} ${mine?'<span class="tag">You</span>':''}</div>
    <span class="badge ${c.status}">${c.status}</span>
    <div class="c-act">${actions}</div>
  </div>`;
}

function settingsTab(k, admin) {
  if(!admin) return '<div class="card">Sirf admin settings dekh sakta hai</div>';
  return `<div class="card"><h3>Kameti Info</h3>
    <div class="profile-row"><span>Naam</span><b>${esc(k.name)}</b></div>
    <div class="profile-row"><span>Frequency</span><b>${k.frequency==='daily'?'Daily':'Monthly'}</b></div>
    <div class="profile-row"><span>Amount</span><b>${money(k.amount)}</b></div>
    <div class="profile-row"><span>Months</span><b>${k.total_months}</b></div>
    <div class="profile-row"><span>Code</span><b>${k.code}</b></div>
  </div>
  <div class="card"><h3 style="color:var(--danger)">Danger Zone</h3>
    <button class="btn danger" onclick="deleteModal('${k.id}')">🗑 Kameti Delete Karein</button>
  </div>`;
}

function profileView() {
  return `<div class="page-head"><h1>Meri Profile</h1></div>
  <div class="card narrow">
    <div class="profile-row"><span>Naam</span><b>${esc(currentProfile.name)}</b></div>
    <div class="profile-row"><span>Phone</span><b>${esc(currentProfile.phone)}</b></div>
    <div class="profile-row"><span>Role</span><b>${currentProfile.role==='superadmin'?'👑 Super Admin':'👤 Member'}</b></div>
    <hr><button class="btn danger" onclick="logout()">Logout</button>
  </div>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
async function approveMember(kid, mid) {
  await supabase.from('members').update({status:'approved'}).eq('id', mid);
  let { data: rounds } = await supabase.from('rounds').select('id').eq('kameti_id', kid);
  let contribs = rounds.map(r => ({ round_id: r.id, member_id: mid, status: 'unpaid' }));
  await supabase.from('contributions').insert(contribs);
  await loadKametiDetail(kid); render();
  toast('Approved', 'success');
}

async function rejectMember(kid, mid) {
  await supabase.from('members').update({status:'rejected'}).eq('id', mid);
  await loadKametiDetail(kid); render();
}

async function removeMember(kid, mid) {
  if(!confirm('Remove member?')) return;
  await supabase.from('members').delete().eq('id', mid);
  await loadKametiDetail(kid); render();
}

async function toggleAdmin(kid, mid) {
  const k = activeKameti;
  const m = k.members.find(x=>x.id===mid);
  if(!m || !m.user_id || m.user_id === k.owner_id) return;
  let isA = k.admin_ids.includes(m.user_id);
  let newA = isA ? k.admin_ids.filter(id=>id!==m.user_id) : [...k.admin_ids, m.user_id];
  await supabase.from('kametis').update({admin_ids:newA}).eq('id', kid);
  await loadKametiDetail(kid); render();
}

function addMemberModal(kid) {
  openModal(`<h2>Member Add</h2><form onsubmit="return addMemberSave(event, '${kid}')">
    <label>Naam</label><input id="am_name" required>
    <label>Phone</label><input id="am_phone" type="tel" placeholder="03XXXXXXXXX">
    <div class="btn-row" style="margin-top:8px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Add</button></div>
  </form>`);
}

async function addMemberSave(e, kid) {
  e.preventDefault();
  const name = document.getElementById('am_name').value.trim();
  const phone = document.getElementById('am_phone').value.trim().replace(/\s/g,'');
  if(!name) return;
  let { data: newM, error: mErr } = await supabase.from('members').insert({kameti_id:kid, name, phone, status:'approved'}).select().maybeSingle();
  if(mErr || !newM) return toast('Failed to add member', 'error');
  
  let { data: rounds } = await supabase.from('rounds').select('id').eq('kameti_id', kid);
  let contribs = rounds.map(r => ({ round_id: r.id, member_id: newM.id, status: 'unpaid' }));
  await supabase.from('contributions').insert(contribs);
  modalHTML = null; await loadKametiDetail(kid); render();
}

async function markPaid(kid, rid, mid) {
  await supabase.from('contributions').update({status:'paid', paid_at:new Date().toISOString()}).eq('round_id',rid).eq('member_id',mid);
  await loadKametiDetail(kid); render();
}

async function unmarkPaid(kid, rid, mid) {
  await supabase.from('contributions').update({status:'unpaid', paid_at:null, method:null, note:null, submitted_at:null}).eq('round_id',rid).eq('member_id',mid);
  await loadKametiDetail(kid); render();
}

function payModal(kid, rid, mid) {
  openModal(`<h2>Payment Karein</h2><form onsubmit="return submitPay(event, '${kid}','${rid}','${mid}')">
    <label>Method</label><select id="pm_method"><option>Cash</option><option>Easypaisa</option><option>JazzCash</option><option>Bank</option></select>
    <label>Note (optional)</label><input id="pm_note">
    <div class="btn-row" style="margin-top:8px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Send</button></div>
  </form>`);
}

async function submitPay(e, kid, rid, mid) {
  e.preventDefault();
  const method = document.getElementById('pm_method').value;
  const note = document.getElementById('pm_note').value.trim();
  await supabase.from('contributions').update({status:'submitted', method, note, submitted_at:new Date().toISOString()}).eq('round_id',rid).eq('member_id',mid);
  modalHTML = null; await loadKametiDetail(kid); render();
}

function deleteModal(kid) {
  openModal(`<h2>Confirm Delete</h2><p class="small muted" style="margin-bottom:12px">Enter phone and kameti name.</p>
    <form onsubmit="return confirmDel(event, '${kid}')">
      <label>Phone</label><input id="d_phone" type="tel">
      <label>Kameti Name</label><input id="d_name">
      <div class="btn-row" style="margin-top:8px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn danger">Delete</button></div>
    </form>`);
}

async function confirmDel(e, kid) {
  e.preventDefault();
  const p = document.getElementById('d_phone').value.trim();
  const n = document.getElementById('d_name').value.trim();
  try {
    await supabase.rpc('soft_delete_kameti', { p_kameti_id: kid, p_phone: p, p_name: n });
    modalHTML = null; await loadKametis(); go('dashboard'); toast('Deleted','success');
  } catch(e) { toast(e.message,'error'); }
}

/* ============================================================
   CHANNELS
   ============================================================ */
function setupChannels(kametiId) {
  if(presenceChannel) supabase.removeChannel(presenceChannel);
  if(spinChannel) supabase.removeChannel(spinChannel);
  
  const db = supabase.channel('db-'+kametiId).on('postgres_changes', { event:'*', schema:'public', table:'rounds', filter:`kameti_id=eq.${kametiId}` }, async () => {
    await loadKametiDetail(kametiId); render();
  }).subscribe();

  presenceChannel = supabase.channel('p-'+kametiId, { config: { presence: { key: currentProfile.id } } });
  presenceChannel.on('presence', { event:'sync' }, () => {
    let state = presenceChannel.presenceState();
    onlineMembers = [];
    Object.values(state).forEach(arr => arr.forEach(p => {
      if(!onlineMembers.includes(p.user_id)) onlineMembers.push(p.user_id);
    }));
    if(view.tab === 'spin' || view.tab === 'members') render();
  }).subscribe(async (status) => {
    if(status === 'SUBSCRIBED') await presenceChannel.track({ user_id: currentProfile.id });
  });

  spinChannel = supabase.channel('s-'+kametiId);
  spinChannel.on('broadcast', { event:'spin_start' }, ({ payload }) => {
    isSpinning = true; render();
    setTimeout(()=>{
      let el = document.getElementById('wheel-rotate');
      if(el) { el.style.transition = `transform ${payload.duration}ms cubic-bezier(.15,.7,.25,1)`; el.style.transform = `rotate(${payload.target}deg)`; }
    }, 100);
  }).on('broadcast', { event:'spin_result' }, async ({ payload }) => {
    if(!celebratedRounds.has(payload.roundId)) { celebratedRounds.add(payload.roundId); showCelebration(payload.winnerName, payload.poolAmt); }
    isSpinning = false; await loadKametiDetail(kametiId); render();
  }).subscribe();
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kameti Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #10B981; --primary-dark: #059669; --primary-light: #D1FAE5;
  --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --muted: #64748B;
  --border: #E2E8F0; --danger: #EF4444; --warning: #F59E0B;
  --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
  --shadow-md: 0 4px 16px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { background: #E2E8F0; color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
body[dir="rtl"] { direction: rtl; }
#app-wrapper { display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); position: relative; box-shadow: 0 0 40px rgba(0,0,0,.1); overflow: hidden; }

/* APP HEADER */
.app-header { background: var(--surface); padding: calc(var(--safe-top) + 14px) 20px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; flex-shrink: 0; }
.header-title { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.lang-switch { display: flex; background: #F1F5F9; border-radius: 10px; padding: 3px; }
.lang-switch button { border: none; background: transparent; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 11px; color: var(--muted); cursor: pointer; transition: .2s; }
.lang-switch button.on { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }

/* APP CONTENT AREA */
#app-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 100px; -webkit-overflow-scrolling: touch; }
#app-content::-webkit-scrollbar { display: none; }

/* BOTTOM NAVIGATION */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 10px calc(var(--safe-bottom) + 8px); z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 600; cursor: pointer; padding: 4px 12px; border-radius: 12px; transition: .2s; }
.nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
.nav-item.on { color: var(--primary-dark); }
.nav-item.on svg { stroke: var(--primary-dark); }

/* CARDS & UI */
.card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 16px; }
.page-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
.page-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; font-weight: 500; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; transition: .15s; width: 100%; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
.btn.primary:disabled { opacity: .5; box-shadow: none; }
.btn.danger { background: #FEF2F2; color: var(--danger); }
.btn.outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn.sm { padding: 10px 16px; font-size: 13px; border-radius: 10px; width: auto; }

/* KAMETI CARD */
.k-card { background: var(--surface); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; transition: .2s; position: relative; overflow: hidden; }
.k-card:active { transform: scale(0.98); }
.k-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
.k-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.k-name { font-weight: 800; font-size: 17px; margin-bottom: 3px; }
.k-meta { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.k-badge { padding: 4px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.k-badge.active { background: var(--primary-light); color: var(--primary-dark); }
.k-badge.completed { background: #DBEAFE; color: #1E40AF; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #F8FAFC; padding: 12px; border-radius: 12px; }
.k-grid-item { display: flex; flex-direction: column; gap: 2px; }
.k-label { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.k-value { font-size: 14px; font-weight: 800; color: var(--text); }

/* FAB */
.fab { position: absolute; bottom: calc(var(--safe-bottom) + 80px); right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--text); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(15,23,42,.3); border: none; cursor: pointer; z-index: 40; transition: .2s; }
.fab:active { transform: scale(0.9); }

/* FORMS */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
input, select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 500; background: #F8FAFC; transition: .2s; outline: none; }
input:focus, select:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }

/* AUTH */
.auth-screen { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 20px; background: var(--bg); }
.auth-logo { width: 72px; height: 72px; background: var(--primary); color: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(16,185,129,.3); }
.auth-title { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.auth-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 30px; font-weight: 500; }

/* SEGMENTED CONTROL */
.segmented { display: flex; background: #F1F5F9; padding: 4px; border-radius: 14px; margin-bottom: 20px; }
.segmented button { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 700; font-size: 13px; color: var(--muted); border-radius: 10px; cursor: pointer; transition: .2s; }
.segmented button.on { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }

/* MEMBER LIST */
.m-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; }
.m-item:last-child { border-bottom: none; }
.m-avatar { width: 42px; height: 42px; border-radius: 50%; background: #E2E8F0; color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
.m-info { flex: 1; }
.m-name { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 6px; }
.m-sub { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.online-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px var(--primary-light); }

/* SPIN WHEEL */
.wheel-container { position: relative; width: 260px; height: 260px; margin: 20px auto; }
.wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; box-shadow: 0 0 0 8px #fff, 0 0 0 12px #FBBF24, 0 20px 40px rgba(0,0,0,.15); transition: transform 0s; }
.wheel-center { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 4px solid #FBBF24; z-index: 5; }
.wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 32px; color: var(--danger); z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
.w-spoke { position: absolute; top: 50%; left: 50%; width: 0; transform-origin: 0 0; z-index: 2; pointer-events: none; }
.w-spoke span { position: absolute; bottom: 10px; left: 0; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; }

/* ONLINE PRESENCE */
.presence-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
.presence-bar::-webkit-scrollbar { display: none; }
.p-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #F8FAFC; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.p-chip.online { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary-light); }

/* CELEBRATION */
.celebration { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle, #F59E0B, #B45309); display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 20px; overflow: hidden; }
.cel-content { position: relative; z-index: 2; animation: popIn .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.cel-emoji { font-size: 80px; animation: bounce 1s infinite alternate; }
@keyframes bounce { to { transform: translateY(-15px) scale(1.1); } }
.cel-title { font-size: 20px; font-weight: 800; letter-spacing: 4px; margin: 15px 0 5px; text-shadow: 0 2px 4px rgba(0,0,0,.2); }
.cel-name { font-size: 42px; font-weight: 900; margin: 10px 0; text-shadow: 0 4px 20px rgba(0,0,0,.3); }
.cel-msg { font-size: 20px; font-weight: 600; margin-bottom: 20px; font-family: 'Noto Nastaliq Urdu', serif; }
.cel-amount { font-size: 24px; font-weight: 800; background: rgba(255,255,255,.2); padding: 10px 30px; border-radius: 30px; border: 2px solid rgba(255,255,255,.4); backdrop-filter: blur(4px); }
.confetti { position: absolute; width: 10px; height: 10px; top: -20px; animation: fall linear forwards; z-index: 1; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.6); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 200; animation: fadeIn .2s; }
.modal-sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + var(--safe-bottom)); animation: slideUp .3s cubic-bezier(.1,.8,.3,1); max-height: 90vh; overflow-y: auto; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideUp { from { transform: translateY(100%); } }
.modal-drag { width: 40px; height: 5px; background: #CBD5E1; border-radius: 10px; margin: 0 auto 20px; }
.toast { position: fixed; top: calc(var(--safe-top) + 20px); left: 50%; transform: translate(-50%, -100px); background: #0F172A; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow-lg); transition: .3s cubic-bezier(.1,.8,.3,1); z-index: 500; opacity: 0; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.error { background: var(--danger); }
</style>
</head>
<body>

<div id="app-wrapper">
  <!-- Header -->
  <header class="app-header" id="app-header" style="display:none">
    <div class="header-title" id="header-title">💰 Kameti Pro</div>
    <div class="lang-switch">
      <button onclick="setLang('en')" id="l-en">EN</button>
      <button onclick="setLang('ru')" id="l-ru">RU</button>
      <button onclick="setLang('ur')" id="l-ur">UR</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-content"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav" style="display:none">
    <button class="nav-item on" id="nav-home" onclick="go('dashboard')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span id="nav-lbl-home">Home</span>
    </button>
    <button class="nav-item" id="nav-profile" onclick="go('profile')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span id="nav-lbl-profile">Profile</span>
    </button>
  </nav>

  <!-- FAB for Super Admin -->
  <button class="fab" id="fab-create" style="display:none" onclick="go('create')">+</button>
</div>

<div id="toast-container"></div>

<script>
/* ============================================================
   CONFIG & STATE
   ============================================================ */
const SUPABASE_URL='https://uxhejibemixdwedmpmri.supabase.co';
const SUPABASE_KEY='sb_publishable_VJEJOGE-OjrWxObF6wE5wQ_T926zRp8';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SUPER_ADMIN_PHONE='03176407904';
const SPIN_DURATION=20000;

let currentUser=null, currentProfile=null, kametis=[], activeKameti=null, trashItems=[];
let view={name:'dashboard', kametiId:null, tab:'overview'};
let otpSent=false, pendingPhone='';
let realtimeSub=null, presenceChannel=null, spinChannel=null;
let onlineMembers=[], modalHTML=null, isSpinning=false;
const celebratedRounds=new Set(), openRounds=new Set();

/* ============================================================
   I18N
   ============================================================ */
const i18n={
en:{home:'Home',profile:'Profile',logout:'Logout',welcome:'Welcome',noKameti:'No Kameti found',createNew:'Create Kameti',members:'Members',months:'Months',pool:'Pool',active:'Active',completed:'Completed',overview:'Overview',spin:'Spin',payments:'Payments',settings:'Settings',spinNow:'Spin Now',online:'Online',offline:'Offline',mubarak:'Mubarak Ho',apkiKameti:'Aap ki kameti nikal aayi hai',khushNaseeb:'Khush Naseeb',delete:'Delete',trash:'Trash',restore:'Restore',deleteForever:'Delete Forever',cancel:'Cancel',save:'Save',add:'Add',payNow:'Pay Now',paid:'Paid',unpaid:'Unpaid',pending:'Pending'},
ru:{home:'Home',profile:'Profile',logout:'Logout',welcome:'Assalam-o-Alaikum',noKameti:'Koi Kameti nahi mili',createNew:'Kameti Banayein',members:'Members',months:'Months',pool:'Pool',active:'Active',completed:'Completed',overview:'Overview',spin:'Spin',payments:'Payments',settings:'Settings',spinNow:'Spin Karein',online:'Online',offline:'Offline',mubarak:'Mubarak Ho',apkiKameti:'Aap ki kameti nikal aayi hai',khushNaseeb:'Khush Naseeb',delete:'Delete',trash:'Trash',restore:'Restore',deleteForever:'Delete Forever',cancel:'Cancel',save:'Save',add:'Add',payNow:'Pay Now',paid:'Paid',unpaid:'Unpaid',pending:'Pending'},
ur:{home:'ہوم',profile:'پروفائل',logout:'لاگ آؤٹ',welcome:'السلام علیکم',noKameti:'کوئی کمیٹی نہیں ملی',createNew:'کمیٹی بنائیں',members:'ممبران',months:'مہینے',pool:'پول',active:'فعال',completed:'مکمل',overview:'خلاصہ',spin:'اسپن',payments:'ادائیگی',settings:'ترتیبات',spinNow:'اسپن کریں',online:'آن لائن',offline:'آف لائن',mubarak:'مبارک ہو',apkiKameti:'آپ کی کمیٹی نکل آئی ہے',khushNaseeb:'خوش نصیب',delete:'حذف',trash:'ٹوکری',restore:'بحال',deleteForever:'مستقل حذف',cancel:'منسوخ',save:'محفوظ',add:'شامل',payNow:'ادا کریں',paid:'ادا شدہ',unpaid:'غیر ادا شدہ',pending:'زیر التواء'}
};
let lang=localStorage.getItem('kameti_lang')||'en';
function t(k){return (i18n[lang]&&i18n[lang][k])||i18n.en[k]||k}
function setLang(l){lang=l;localStorage.setItem('kameti_lang',l);document.documentElement.lang=l;document.body.dir=l==='ur'?'rtl':'ltr';updateLangUI();render()}
function updateLangUI(){
  document.getElementById('l-en').className=lang==='en'?'on':'';
  document.getElementById('l-ru').className=lang==='ru'?'on':'';
  document.getElementById('l-ur').className=lang==='ur'?'on':'';
  document.getElementById('nav-lbl-home').textContent=t('home');
  document.getElementById('nav-lbl-profile').textContent=t('profile');
}

/* ============================================================
   HELPERS
   ============================================================ */
const uid=()=>{try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now()+Math.random().toString(36).substr(2,5)}};
const money=n=>'Rs '+Number(n||0).toLocaleString('en-US');
const todayISO=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shortName=s=>{s=String(s||'');return s.length>10?s.slice(0,9)+'…':s};
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return isNaN(d.getTime())?s:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function toast(msg,type){const el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2500)}
function openModal(h){modalHTML=h;render()}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;modalHTML=null;render()}
function go(name,kametiId){view={name,kametiId:kametiId||null,tab:'overview'};openRounds.clear();if(name!=='kameti')teardownChannels();document.getElementById('app-content').scrollTop=0;render()}
function setTab(tv){view.tab=tv;render()}
function toE164(p){let x=p.replace(/[\s\-()]/g,'');if(x.startsWith('0'))x='+92'+x.slice(1);if(!x.startsWith('+'))x='+92'+x;return x}
function roundContribution(k){return k.frequency==='daily'?k.amount*30:k.amount}
function poolAmount(k){const n=k.members.filter(m=>m.status==='approved').length;return roundContribution(k)*n}

/* ============================================================
   AUTH
   ============================================================ */
async function sendOTP(phone){
  if(!phone)return toast('Enter phone','error');
  try{
    const {error}=await supabase.auth.signInWithOtp({phone:toE164(phone),options:{shouldCreateUser:true}});
    if(error)throw error;
    pendingPhone=phone;otpSent=true;render();
    toast('OTP Sent','success');
  }catch(e){toast(e.message,'error')}
}
async function verifyOTP(token){
  if(!token)return toast('Enter OTP','error');
  try{
    const {error}=await supabase.auth.verifyOtp({phone:toE164(pendingPhone),token,type:'sms'});
    if(error)throw error;
    await loadProfile();await loadKametis();
    otpSent=false;go('dashboard');toast('Welcome!','success');
  }catch(e){toast(e.message,'error')}
}
async function loadProfile(){
  const {data:{user}}=await supabase.auth.getUser();
  if(!user){currentUser=null;currentProfile=null;return}
  currentUser=user;
  const {data,error}=await supabase.from('profiles').select('*').eq('id',user.id).single();
  if(error)throw error;
  currentProfile=data;
  document.getElementById('app-header').style.display='flex';
  document.getElementById('bottom-nav').style.display='flex';
  document.getElementById('fab-create').style.display=currentProfile.role==='superadmin'?'flex':'none';
}
async function logout(){
  if(!confirm(t('logout')+'?'))return;
  teardownChannels();await supabase.auth.signOut();
  currentUser=null;currentProfile=null;otpSent=false;pendingPhone='';
  document.getElementById('app-header').style.display='none';
  document.getElementById('bottom-nav').style.display='none';
  document.getElementById('fab-create').style.display='none';
  view={name:'dashboard'};render();
}

/* ============================================================
   DATA
   ============================================================ */
async function loadKametis(){
  if(!currentProfile){kametis=[];return}
  const {data}=await supabase.from('kametis').select('*').is('deleted_at',null).order('created_at',{ascending:false});
  kametis=data||[];
}
async function loadKametiDetail(id){
  const {data:k,error}=await supabase.from('kametis').select('*').eq('id',id).single();
  if(error)throw error;
  const {data:m}=await supabase.from('members').select('*').eq('kameti_id',id);
  const {data:r}=await supabase.from('rounds').select('*').eq('kameti_id',id).order('index');
  const {data:c}=await supabase.from('contributions').select('*').in('round_id',(r||[]).map(x=>x.id));
  activeKameti={...k,members:m||[],rounds:(r||[]).map(rr=>({...rr,contributions:(c||[]).filter(cc=>cc.round_id===rr.id)}))};
  return activeKameti;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  updateLangUI();
  const app=document.getElementById('app-content');
  if(!currentProfile){app.innerHTML=authView();return}
  let body='';
  switch(view.name){
    case 'dashboard':body=dashboardView();break;
    case 'create':body=createView();break;
    case 'kameti':body=kametiView(view.kametiId);break;
    case 'profile':body=profileView();break;
    default:body=dashboardView();
  }

}

  div.innerHTML='<input class="m-name" placeholder="Name" style="flex:1;padding:10px"><input class="m-phone" type="tel" placeholder="03XXXXXXXXX" style="flex:1;padding:10px"><button class="btn danger sm" onclick="this.parentElement.remove()">✕</button>';

async function createKameti(e){
  e.preventDefault();
  const name=document.getElementById('k_name').value.trim();
  const freq=document.getElementById('k_freq').value;
  const amount=parseInt(document.getElementById('k_amt').value);
  const months=parseInt(document.getElementById('k_months').value);
  const spinDay=parseInt(document.getElementById('k_spinday').value);
  const startDate=document.getElementById('k_date').value;
  const adminInc=document.getElementById('k_admin_included').checked;
  let members=[];
  if(adminInc)members.push({name:currentProfile.name,phone:currentProfile.phone,user_id:currentProfile.id});
  document.querySelectorAll('.m-name').forEach((inp,i)=>{
    const n=inp.value.trim(); const p=document.querySelectorAll('.m-phone')[i].value.trim().replace(/\s/g,'');
    if(n)members.push({name:n,phone:p});
  });
  if(members.length<2)return toast('Add at least 2 members','error');
  try{
    const {data:k,error}=await supabase.from('kametis').insert({name,code:Math.random().toString(36).substr(2,6).toUpperCase(),owner_id:currentProfile.id,admin_ids:[currentProfile.id],frequency:freq,amount,total_months:months,spin_day:spinDay,start_date:startDate,status:'active',admin_included:adminInc}).select().single();
    if(error)throw error;
    await supabase.from('members').insert(members.map(m=>({kameti_id:k.id,user_id:m.user_id||null,name:m.name,phone:m.phone,status:'approved'})));
    const rRows=[]; for(let i=0;i<months;i++){const d=new Date(startDate);d.setMonth(d.getMonth()+i);rRows.push({kameti_id:k.id,index:i+1,date:d.toISOString().slice(0,10),spin_state:'pending'})}
    const {data:r}=await supabase.from('rounds').insert(rRows).select();
    const {data:m}=await supabase.from('members').select('id').eq('kameti_id',k.id);
    const cRows=[]; r.forEach(rr=>m.forEach(mm=>cRows.push({round_id:rr.id,member_id:mm.id,status:'unpaid'})));
    await supabase.from('contributions').insert(cRows);
    await loadKametis();go('dashboard');toast('Kameti Created!','success');
  }catch(e){toast(e.message,'error')}
}

function kametiView(id){
  const k=activeKameti;
  if(!k||k.id!==id)return '<div style="text-align:center;padding:50px">Loading...</div>';
  const admin=currentProfile.role==='superadmin'||k.admin_ids.includes(currentProfile.id);
  let html='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="btn outline sm" style="width:auto;padding:8px 12px" onclick="go(\'dashboard\')">←</button><h1 class="page-title" style="margin:0">'+esc(k.name)+'</h1></div>';
  
  const tabs=[['overview','Info'],['members','Members'],['spin','🎡 Spin'],['payments','Payments'],['settings','Settings']];
  html+='<div class="segmented">'+tabs.map(([tv,l])=>'<button class="'+(view.tab===tv?'on':'')+'" onclick="setTab(\''+tv+'\')">'+l+'</button>').join('')+'</div>';

  if(view.tab==='overview')html+=overviewTab(k,admin);
  else if(view.tab==='members')html+=membersTab(k,admin);
  else if(view.tab==='spin')html+=spinTab(k,admin);
  else if(view.tab==='payments')html+=paymentsTab(k,admin);
  else if(view.tab==='settings')html+=settingsTab(k,admin);
  return html;
}
function overviewTab(k,admin){
  const done=k.rounds.filter(r=>r.receiver_member_id).length;
  return '<div class="card"><div class="k-grid"><div class="k-grid-item"><span class="k-label">Amount</span><span class="k-value">'+money(k.amount)+'</span></div><div class="k-grid-item"><span class="k-label">Pool</span><span class="k-value">'+money(poolAmount(k))+'</span></div><div class="k-grid-item"><span class="k-label">Spins</span><span class="k-value">'+done+'/'+k.rounds.length+'</span></div></div></div>'+
    '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Join Code</h3><div style="display:flex;justify-content:space-between;align-items:center;background:#F8FAFC;padding:12px;border-radius:12px;border:1.5px dashed #CBD5E1"><span style="font-weight:800;letter-spacing:2px;font-size:18px">'+k.code+'</span><button class="btn primary sm" onclick="navigator.clipboard.writeText(\''+k.code+'\');toast(\'Copied\')">Copy</button></div></div>';
}
function membersTab(k,admin){
  const approved=k.members.filter(m=>m.status==='approved');
  let html='<div class="card">';
  approved.forEach(m=>{
    const isOn=onlineMembers.some(o=>o.user_id===m.user_id);
    html+='<div class="m-item"><div class="m-avatar">'+esc(m.name.charAt(0))+'</div><div class="m-info"><div class="m-name">'+esc(m.name)+(isOn?' <span class="online-dot"></span>':'')+'</div><div class="m-sub">'+esc(m.phone||'No phone')+'</div></div>'+
      (admin&&m.user_id!==k.owner_id?'<button class="btn danger sm" onclick="removeMember(\''+k.id+'\',\''+m.id+'\')">✕</button>':'')+'</div>';
  });
  return html+'</div>';
}

function spinTab(k,admin){
  const approved=k.members.filter(m=>m.status==='approved');
  const pending=k.rounds.find(r=>!r.receiver_member_id);
  const pool=approved.filter(m=>!k.won_member_ids.includes(m.id));
  const display=pool.length?pool:approved;

  let html='<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px"><span>ONLINE: '+approved.filter(m=>onlineMembers.some(o=>o.user_id===m.user_id)).length+'/'+approved.length+'</span><span>POOL: '+money(poolAmount(k))+'</span></div><div class="presence-bar">'+approved.map(m=>{const on=onlineMembers.some(o=>o.user_id===m.user_id);return '<div class="p-chip '+(on?'online':'')+'">'+esc(m.name.split(' ')[0])+'</div>'}).join('')+'</div></div>';

  if(pending){
    html+='<div class="card"><div class="wheel-container"><div class="wheel" id="wheel" style="background:conic-gradient('+display.map((m,i)=>{const c=['#10B981','#3B82F6','#8B5CF6','#EC4899','#F59E0B'][i%5];const seg=360/display.length;return c+' '+(i*seg)+'deg '+((i+1)*seg)+'deg'}).join(',')+')">'+
      display.map((m,i)=>{const a=(i*(360/display.length))+((360/display.length)/2);return '<div class="w-spoke" style="transform:rotate('+(a-180)+'deg);height:110px"><span>'+esc(shortName(m.name))+'</span></div>'}).join('')+
      '<div class="wheel-center">🎡</div></div><div class="wheel-pointer">▼</div></div>';
    if(isSpinning)html+='<div style="text-align:center;font-weight:800;color:var(--primary);animation:pulse 1s infinite">Spinning...</div>';
    else if(admin)html+='<button class="btn primary" style="margin-top:10px" onclick="doSpin(\''+k.id+'\',\''+pending.id+'\')">Start Spin</button>';
    else html+='<div style="text-align:center;font-size:13px;color:var(--muted)">Admin will spin soon</div>';
    html+='</div>';
  }else{
    html+='<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px;margin-bottom:10px">🏁</div><h3>All Spins Complete</h3></div>';
  }
  return html;
}
async function doSpin(kid,rid){
  if(isSpinning)return;
  const k=activeKameti; const pool=k.members.filter(m=>m.status==='approved'&&!k.won_member_ids.includes(m.id));
  const display=pool.length?pool:k.members.filter(m=>m.status==='approved');
  try{
    const {data,error}=await supabase.rpc('spin_round',{p_round_id:rid});
    if(error)throw error;
    isSpinning=true;render();
    const target=360*8+(360-(data.winner_index*(360/data.total)+(360/data.total)/2));
    if(spinChannel)spinChannel.send({type:'broadcast',event:'spin_start',payload:{target,duration:SPIN_DURATION,roundId:rid}});
    setTimeout(()=>{const el=document.getElementById('wheel');if(el){el.style.transition='transform '+SPIN_DURATION+'ms cubic-bezier(.15,.7,.25,1)';el.style.transform='rotate('+target+'deg)'}},100);
    setTimeout(async()=>{
      await supabase.rpc('complete_spin',{p_round_id:rid});
      if(spinChannel)spinChannel.send({type:'broadcast',event:'spin_result',payload:{winnerName:data.winner_name,poolAmt:poolAmount(k),roundId:rid}});
      isSpinning=false; if(!celebratedRounds.has(rid)){celebratedRounds.add(rid);showCelebration(data.winner_name,poolAmount(k))}
      await loadKametiDetail(kid);render();
    },SPIN_DURATION);
  }catch(e){toast(e.message,'error')}
}

function paymentsTab(k,admin){
  let html='<div class="card">';
  k.rounds.slice().reverse().forEach(r=>{
    const rec=k.members.find(m=>m.id===r.receiver_member_id);

  });
  return html+'</div>';
}
function settingsTab(k,admin){

  return '<div class="card"><button class="btn danger" onclick="deleteModal(\''+k.id+'\')">Delete Kameti</button></div>';

async function confirmDel(kid){

  try{await supabase.rpc('soft_delete_kameti',{p_kameti_id:kid,p_phone:p,p_name:n});modalHTML=null;go('dashboard');toast('Deleted','success')}catch(e){toast(e.message,'error')}

/* ============================================================
   CHANNELS (PRESENCE & SYNC)
   ============================================================ */
function setupChannels(kametiId){
  teardownChannels();
  const db=supabase.channel('db-'+kametiId).on('postgres_changes',{event:'*',schema:'public',table:'rounds',filter:'kameti_id=eq.'+kametiId},async()=>{await loadKametiDetail(kametiId);render()}).subscribe();
  
  presenceChannel=supabase.channel('p-'+kametiId,{config:{presence:{key:currentProfile.id}}});
  presenceChannel.on('presence',{event:'sync'},()=>{
    const s=presenceChannel.presenceState();const l=[];
    Object.values(s).forEach(a=>a.forEach(p=>{if(!l.find(x=>x.user_id===p.user_id))l.push(p)}));
    onlineMembers=l; if(view.tab==='spin'||view.tab==='members')render();
  }).subscribe(async(s)=>{if(s==='SUBSCRIBED')await presenceChannel.track({user_id:currentProfile.id})});
  
  spinChannel=supabase.channel('s-'+kametiId);
  spinChannel.on('broadcast',{event:'spin_start'},({payload})=>{
    isSpinning=true;render();
    setTimeout(()=>{const el=document.getElementById('wheel');if(el){el.style.transition='transform '+payload.duration+'ms cubic-bezier(.15,.7,.25,1)';el.style.transform='rotate('+payload.target+'deg)'}},100);
  }).on('broadcast',{event:'spin_result'},async({payload})=>{
    if(!celebratedRounds.has(payload.roundId)){celebratedRounds.add(payload.roundId);showCelebration(payload.winnerName,payload.poolAmt)}
    isSpinning=false;await loadKametiDetail(kametiId);render();
  }).subscribe();
  
  realtimeSub=()=>{supabase.removeChannel(db);if(presenceChannel)supabase.removeChannel(presenceChannel);if(spinChannel)supabase.removeChannel(spinChannel)};
}
function teardownChannels(){if(realtimeSub){realtimeSub();realtimeSub=null}onlineMembers=[]}

/* ============================================================
   CELEBRATION & VOICE
   ============================================================ */
function showCelebration(name,amt){
  const ov=document.createElement('div');ov.className='celebration';
  ov.innerHTML='<div class="cel-content"><div class="cel-emoji">🎉</div><div class="cel-title">'+t('khushNaseeb')+'</div><div class="cel-name">'+esc(name)+'</div><div class="cel-msg">'+t('mubarak')+'<br><span style="font-size:16px">'+t('apkiKameti')+'</span></div><div class="cel-amount">'+money(amt)+'</div></div>';
  document.body.appendChild(ov);
  for(let i=0;i<60;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#FBBF24','#F59E0B','#EF4444','#3B82F6','#10B981','#8B5CF6'][i%6];c.style.animationDuration=(2+Math.random()*2)+'s';ov.appendChild(c)}
  try{
    const u=new SpeechSynthesisUtterance(name+' آپ کو مبارک ہو، آپ کی کمیٹی نکل آئی ہے');
    u.lang='ur-PK';u.rate=.85;speechSynthesis.speak(u);
  }catch(e){}
  setTimeout(()=>{ov.style.opacity='0';setTimeout(()=>ov.remove(),500)},8000);
}

    '<div class="card" style="text-align:center"><div class="m-avatar" style="width:70px;height:70px;font-size:28px;margin:0 auto 12px;background:var(--primary-light);color:var(--primary-dark)">'+esc(currentProfile.name.charAt(0))+'</div>'+
    '<h2 style="font-size:20px;font-weight:800">'+esc(currentProfile.name)+'</h2><p style="color:var(--muted);font-size:14px">'+esc(currentProfile.phone)+'</p>'+
    '<span class="k-badge active" style="display:inline-block;margin-top:8px">'+currentProfile.role+'</span></div>'+
    '<button class="btn danger" onclick="logout()">Logout</button>';
}

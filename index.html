<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kameti Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--primary:#059669;--primary-d:#047857;--primary-l:#d1fae5;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--warn:#d97706;--gold:#f59e0b;--radius:16px;--shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{direction:rtl}
h1,h2,h3{font-weight:700;line-height:1.25}
h1{font-size:22px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin-bottom:8px}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;background:#fff;outline:none;transition:.15s;margin-bottom:10px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:12px;font-weight:600;cursor:pointer;transition:.15s;width:100%;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(5,150,105,.3)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--danger)}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;min-height:38px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{width:auto;flex:1;min-width:120px}
.mini{padding:8px 13px;font-size:12.5px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-weight:600;cursor:pointer;min-height:34px}
.mini.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.mini.danger{background:#fef2f2;border-color:#fecaca;color:var(--danger)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.tag{background:var(--primary-l);color:var(--primary-d);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;vertical-align:middle}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#059669,#047857,#065f46);padding-top:calc(var(--safe-top)+20px);padding-bottom:calc(var(--safe-bottom)+20px)}
.auth-card{background:#fff;border-radius:24px;padding:30px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.brand{font-size:48px;text-align:center}
.auth-card h1{text-align:center;margin-top:10px}
.auth-card>p{text-align:center;margin-bottom:18px;font-size:13.5px}
.hint{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:10px 13px;border-radius:11px;font-size:12.5px;margin-bottom:14px;text-align:center}

.topbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding-top:var(--safe-top);box-shadow:0 1px 4px rgba(15,23,42,.04)}
.topbar-top{max-width:920px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-sm{font-weight:800;font-size:16px;cursor:pointer;color:var(--primary-d);display:flex;align-items:center;gap:6px}
.lang-switch{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:2px}
.lang-switch button{border:none;background:transparent;padding:6px 9px;border-radius:7px;font-weight:700;font-size:11.5px;color:var(--muted);cursor:pointer;min-width:32px}
.lang-switch button.on{background:#fff;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{max-width:920px;margin:0 auto;padding:0 14px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:none;padding:8px 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:36px}
.nav button.on{background:var(--primary-l);color:var(--primary-d)}
.nav .logout{color:var(--danger);margin-inline-start:auto}

.container{max-width:920px;margin:0 auto;padding:16px 14px calc(60px + var(--safe-bottom))}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid #eef2f6}
.card.narrow{max-width:480px;margin-left:auto;margin-right:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:20px}

.kameti-card{cursor:pointer;border-inline-start:4px solid var(--primary);transition:.15s}
.kameti-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,23,42,.1)}
.kameti-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.grid3 b{font-size:14.5px}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.active,.badge.paid,.badge.approved{background:var(--primary-l);color:var(--primary-d)}
.badge.forming,.badge.submitted,.badge.pending{background:#fef3c7;color:#92400e}
.badge.completed{background:#dbeafe;color:#1e40af}
.badge.unpaid{background:#f1f5f9;color:#475569}
.badge.rejected{background:#fee2e2;color:#991b1b}
.badge.admin{background:#ede9fe;color:#6d28d9}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;border:1px solid #eef2f6;box-shadow:var(--shadow)}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.stat .v{font-size:19px;font-weight:800}
.stat .v.green{color:var(--primary-d)}

.code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f0fdf4;border:1.5px dashed #86efac;border-radius:12px;padding:12px 14px;margin-top:12px}
.code-box .c{font-family:ui-monospace,monospace;font-size:20px;font-weight:800;letter-spacing:3px;color:var(--primary-d)}

.tabs2{display:flex;gap:4px;background:#fff;border-radius:12px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:1;min-width:78px;padding:10px 8px;border:none;background:transparent;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs2 button.on{background:var(--primary);color:#fff}

.round{border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.round.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.09)}
.round-head{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer}
.round-no{width:34px;height:34px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;color:var(--muted);flex-shrink:0}
.round.current .round-no{background:var(--primary);color:#fff}
.round-info{flex:1;min-width:0}
.round-info b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.round-amt{font-weight:800;font-size:13.5px;color:var(--primary-d);white-space:nowrap}
.round-body{display:none;padding:0 14px 12px;border-top:1px solid #f1f5f9}
.round-body.open{display:block}
.contrib{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #f8fafc;flex-wrap:wrap}
.contrib:last-child{border-bottom:none}
.contrib.mine{background:#f0fdf4;margin:0 -14px;padding:10px 14px}
.c-name{flex:1;font-size:13.5px;font-weight:600;min-width:90px}
.c-act{display:flex;gap:5px;flex-wrap:wrap}

.member{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.member:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.member .m-info{flex:1;min-width:110px}
.member .m-info b{display:block;font-size:14px}
.member-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.member-row input{margin-bottom:0;flex:1}

/* ONLINE PRESENCE */
.online-panel{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.online-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.online-header-left{display:flex;align-items:center;gap:7px;font-weight:700}
.live-dot{width:9px;height:9px;background:#10b981;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.online-list{display:flex;flex-wrap:wrap;gap:6px}
.online-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:#f1f5f9;font-size:12px;font-weight:600;color:var(--muted)}
.online-chip .dot{width:6px;height:6px;background:#94a3b8;border-radius:50%;flex-shrink:0}
.online-chip.on{background:var(--primary-l);color:var(--primary-d)}
.online-chip.on .dot{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}

/* SPIN */
.spin-card{background:linear-gradient(180deg,#fff,#f0fdf4);border:1px solid #d1fae5}
.spin-mode-toggle{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:3px;margin-bottom:14px}
.spin-mode-toggle button{flex:1;padding:10px 8px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.spin-mode-toggle button.on{background:#fff;color:var(--primary-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spin-mode-toggle button.on.demo{color:#b45309}
.wheel-wrap{position:relative;width:290px;height:290px;margin:22px auto;max-width:92vw;max-height:92vw}
.wheel{width:100%;height:100%;position:relative;border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.18),0 0 0 6px #fff,0 0 0 10px #fbbf24}
.wheel-rotate{width:100%;height:100%;position:relative;border-radius:50%;transition:transform 0s;transform:rotate(0deg);will-change:transform}
.wheel-face{position:absolute;inset:0;border-radius:50%}
.wheel-center{position:absolute;top:50%;left:50%;width:60px;height:60px;margin:-30px 0 0 -30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:5;border:4px solid #fbbf24}
.wheel-spoke{position:absolute;top:50%;left:50%;width:0;transform-origin:0 0;pointer-events:none;z-index:2}
.wheel-spoke span{position:absolute;bottom:10px;left:0;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);white-space:nowrap}
.wheel-pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#dc2626;z-index:10;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.spin-spinning-banner{text-align:center;padding:14px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#fff;border-radius:12px;font-weight:800;margin:8px 0;animation:spinPulse 1s infinite}
@keyframes spinPulse{50%{opacity:.7}}
.spin-history{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.spin-history:last-child{border-bottom:none}
.sh-round{width:30px;height:30px;border-radius:50%;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.sh-info{flex:1}.sh-info b{display:block;font-size:13.5px}
.sh-amt{font-weight:800;color:var(--primary-d);font-size:13px}

/* CELEBRATION */
.celebration-overlay{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle,rgba(251,191,36,.97) 0%,rgba(217,119,6,.99) 70%,rgba(180,83,9,1) 100%);display:flex;align-items:center;justify-content:center;animation:celebrationIn .5s ease;overflow:hidden}
@keyframes celebrationIn{from{opacity:0}to{opacity:1}}
.celebration-overlay.out{animation:celebrationOut .6s ease forwards}
@keyframes celebrationOut{to{opacity:0;transform:scale(1.05)}}
.celebration-content{text-align:center;color:#fff;padding:30px 20px;z-index:2;position:relative;max-width:90vw;animation:contentPop .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes contentPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.celebration-emoji{font-size:80px;animation:bounceBig 1s infinite alternate;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
@keyframes bounceBig{from{transform:translateY(0) scale(1) rotate(-5deg)}to{transform:translateY(-15px) scale(1.15) rotate(5deg)}}
.celebration-label{font-size:22px;font-weight:800;letter-spacing:6px;opacity:.95;margin:14px 0 8px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.celebration-name{font-size:clamp(32px,9vw,52px);font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.4);margin:12px 0;word-break:break-word;line-height:1.1;animation:nameGlow 2s ease-in-out infinite alternate}
@keyframes nameGlow{to{text-shadow:0 4px 24px rgba(255,255,255,.5),0 0 30px rgba(255,255,255,.4)}}
.celebration-msg{font-size:clamp(18px,4.5vw,24px);font-weight:700;margin:16px 0;font-family:'Noto Nastaliq Urdu','Segoe UI',serif;opacity:.95;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.celebration-amount{font-size:clamp(22px,5.5vw,30px);font-weight:900;background:rgba(255,255,255,.22);padding:12px 28px;border-radius:50px;display:inline-block;margin-top:20px;backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.celebration-confetti-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti{position:absolute;width:12px;height:12px;top:-20px;animation:confettiFall linear forwards}
@keyframes confettiFall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(1080deg);opacity:.3}}

/* MODAL/TOAST */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:640px){.modal-backdrop{align-items:flex-end;padding:0}.modal{border-radius:24px 24px 0 0;max-width:100%;max-height:92vh;animation:slideUp .25s ease;padding-bottom:calc(24px + var(--safe-bottom))}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-bottom));transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.28s;z-index:500;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger)}
.toast.success{background:var(--primary)}

.profile-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px;gap:12px}
.profile-row span{color:var(--muted);flex-shrink:0}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .ico{font-size:44px;margin-bottom:8px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 14px;border-radius:11px;font-size:13px;margin-bottom:12px}
.infobox{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px 14px;border-radius:11px;font-size:13px;margin-bottom:12px}
.trash-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #fecaca;border-inline-start:3px solid var(--danger)}
.trash-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.trash-days{font-size:11.5px;font-weight:700;color:var(--danger);background:#fef2f2;padding:3px 9px;border-radius:20px}
</style>

const uid=()=>crypto.randomUUID();
const code6=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
const money=n=>'Rs '+Number(n||0).toLocaleString('en-US');

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shortName=s=>{s=String(s||'');return s.length>11?s.slice(0,10)+'…':s};
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');if(isNaN(d.getTime()))return s;return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function statusLabel(s){const m={unpaid:'unpaid',submitted:'submitted',paid:'paid',forming:'statusActive',active:'statusActive',completed:'statusCompleted'};return t(m[s]||s)}

function toggleRound(id){openRounds.has(id)?openRounds.delete(id):openRounds.add(id);render()}
function setSpinMode(m){spinMode=m;demoResult=null;render()}
function toE164(p){let x=p.replace(/[\s\-()]/g,'');if(x.startsWith('0'))x='+92'+x.slice(1);if(!x.startsWith('+'))x='+92'+x;return x}
function roundContribution(k){return k.frequency==='daily'?k.amount*30:k.amount}
function poolAmount(k){const n=k.members.filter(m=>m.status==='approved').length;return roundContribution(k)*n}

/* ============================================================
   AUTH
   ============================================================ */
async function sendOTP(phone){
  if(!phone)return toast(t('errorPhone'),'error');
  try{
    const {error}=await supabase.auth.signInWithOtp({phone:toE164(phone),options:{shouldCreateUser:true}});
    if(error)throw error;
    pendingPhone=phone;otpSent=true;render();
    toast(t('otpSentTo')+': '+phone,'success');
  }catch(e){toast(e.message,'error')}
}
async function verifyOTP(token){
  if(!token)return toast(t('errorOtp'),'error');
  try{
    const {error}=await supabase.auth.verifyOtp({phone:toE164(pendingPhone),token,type:'sms'});
    if(error)throw error;
    await loadProfile();await loadKametis();
    otpSent=false;go('dashboard');
    toast(t('welcome')+'!','success');
    cleanupTrash();
  }catch(e){toast(e.message,'error')}
}
async function loadProfile(){
  const {data:{user}}=await supabase.auth.getUser();
  if(!user){currentUser=null;currentProfile=null;return}
  currentUser=user;
  const {data,error}=await supabase.from('profiles').select('*').eq('id',user.id).single();
  if(error)throw error;
  currentProfile=data;
}
async function logout(){
  if(!confirm(t('logoutConfirm')))return;
  teardownChannels();
  await supabase.auth.signOut();
  currentUser=null;currentProfile=null;otpSent=false;pendingPhone='';
  view={name:'dashboard'};render();
}

   DATA
   ============================================================ */
async function loadKametis(){
  if(!currentProfile){kametis=[];return}
  const {data}=await supabase.from('kametis').select('*').is('deleted_at',null).order('created_at',{ascending:false});
  kametis=data||[];
}
async function loadTrash(){
  const {data}=await supabase.from('kametis').select('*').not('deleted_at','is',null).order('deleted_at',{ascending:false});
  return data||[];
}
async function cleanupTrash(){
  if(!currentProfile||currentProfile.role!=='superadmin')return;
  try{await supabase.rpc('auto_cleanup_trash')}catch(e){}
}
async function loadKametiDetail(id){
  const {data:k,error}=await supabase.from('kametis').select('*').eq('id',id).single();
  if(error)throw error;
  const {data:m}=await supabase.from('members').select('*').eq('kameti_id',id);
  const {data:r}=await supabase.from('rounds').select('*').eq('kameti_id',id).order('index');
  const {data:c}=await supabase.from('contributions').select('*').in('round_id',(r||[]).map(x=>x.id));
  activeKameti={...k,members:m||[],rounds:(r||[]).map(rr=>({...rr,contributions:(c||[]).filter(cc=>cc.round_id===rr.id)}))};
  return activeKameti;
}

function render(){
  const app=document.getElementById('app');
  if(!currentProfile){app.innerHTML=authView();return}
  let body='';
  switch(view.name){
    case 'dashboard':body=dashboardView();break;
    case 'create':body=createView();break;
    case 'kameti':body=kametiView(view.kametiId);break;
    case 'profile':body=profileView();break;
    case 'trash':body=trashView();break;
    default:body=dashboardView();
  }
  app.innerHTML=headerView()+'<main class="container">'+body+'</main>'+
    (modalHTML?'<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">'+modalHTML+'</div></div>':'');
}

  const months=parseInt(document.getElementById('k_months').value,10);
  const spinDay=parseInt(document.getElementById('k_spinday').value,10);
  const startDate=document.getElementById('k_date').value;
  const adminIncluded=document.getElementById('k_admin_included').checked;
  if(!name)return toast(t('errorName'),'error');
  if(!amount||amount<10)return toast(t('errorAmt'),'error');
  if(!months||months<2)return toast(t('errorMonths'),'error');
  let members=[];
  if(adminIncluded)members.push({name:currentProfile.name,phone:currentProfile.phone,user_id:currentProfile.id});
  document.querySelectorAll('.member-row').forEach(row=>{
    const n=row.querySelector('.mr-name').value.trim();
    const p=row.querySelector('.mr-phone').value.trim().replace(/\s/g,'');
    if(n)members.push({name:n,phone:p});
  });
  const seen=new Set();
  members=members.filter(m=>{if(m.phone&&seen.has(m.phone))return false;if(m.phone)seen.add(m.phone);return true});
  if(members.length<2)return toast(t('errorMembers'),'error');
  try{
    const {data:kameti,error:kErr}=await supabase.from('kametis').insert({
      name,code:code6(),owner_id:currentProfile.id,admin_ids:[currentProfile.id],
      frequency:freq,amount,total_months:months,spin_day:spinDay,
      start_date:startDate,status:'active',admin_included:adminIncluded
    }).select().single();
    if(kErr)throw kErr;
    await supabase.from('members').insert(members.map(m=>({kameti_id:kameti.id,user_id:m.user_id||null,name:m.name,phone:m.phone,status:'approved'})));
    const parts=startDate.split('-').map(Number);
    const rRows=[];
    for(let i=0;i<months;i++){
      const d=new Date(parts[0],parts[1]-1+i,Math.min(spinDay,28));
      rRows.push({kameti_id:kameti.id,index:i+1,date:d.toISOString().slice(0,10),spin_state:'pending'});
    }
    const {data:rounds}=await supabase.from('rounds').insert(rRows).select();
    const {data:approved}=await supabase.from('members').select('id').eq('kameti_id',kameti.id);
    const cRows=[];(rounds||[]).forEach(r=>(approved||[]).forEach(m=>cRows.push({round_id:r.id,member_id:m.id,status:'unpaid'})));
    if(cRows.length)await supabase.from('contributions').insert(cRows);
    toast('✓','success');
    await loadKametis();await loadKametiDetail(kameti.id);
    go('kameti',kameti.id);setupChannels(kameti.id);
  }catch(e){toast(e.message,'error')}
}

  const pendingR=k.rounds.find(r=>!r.receiver_member_id);

    }
    html+='<div class="card spin-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="badge active">'+t('round')+' #'+pendingR.index+' / '+k.rounds.length+'</span><span class="small muted">'+fmtDate(pendingR.date)+'</span></div>'+
      '<h2 style="text-align:center;margin:6px 0">🎡 Kameti Spin</h2><div class="muted small" style="text-align:center;margin-bottom:4px">'+t('totalPool')+': <b>'+money(poolAmt)+'</b> • '+pool.length+' '+t('members')+'</div>'+
      '<div class="wheel-wrap">'+wheelHTML(pool)+'<div class="wheel-pointer">▼</div></div>';
    if(isSpinning)html+='<div class="spin-spinning-banner">'+t('spinSpinning')+' ⏱ '+Math.ceil(SPIN_DURATION/1000)+'s</div>';
    else if(demoResult)html+='<button class="btn" onclick="resetSpin()" style="margin-top:8px">↻ Reset</button>';
    else if(admin)html+='<button class="btn primary" onclick="doSpin(\''+k.id+'\',\''+pendingR.id+'\')" style="margin-top:8px">🎡 '+t('spinNow')+'</button>';
    else html+='<div class="warnbox" style="text-align:center">'+t('spinWaitAdmin')+' — '+fmtDate(pendingR.date)+'</div>';
    html+='</div>';
  }else{
    html+='<div class="card empty"><div class="ico">🏁</div><h3>'+t('allSpinsDone')+'</h3></div>';
  }
  if(doneR.length){
    html+='<div class="card"><h3>'+t('kametiHistory')+'</h3>';
    doneR.slice().reverse().forEach(r=>{const w=k.members.find(m=>m.id===r.receiver_member_id);html+='<div class="spin-history"><div class="sh-round">#'+r.index+'</div><div class="sh-info"><b>'+esc(w?w.name:'?')+'</b><span class="small muted">'+fmtDate(r.date)+'</span></div><div class="sh-amt">'+money(poolAmt)+'</div></div>'});
    html+='</div>';
  }
  return html;

function resetSpin(){demoResult=null;render()}
function wheelHTML(members){
  if(!members.length)return '<div class="wheel-empty">—</div>';
  const n=members.length,seg=360/n;
  const colors=['#059669','#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#10b981','#6366f1','#f43f5e','#14b8a6','#a855f7','#0284c7','#d946ef'];
  const stops=members.map((m,i)=>colors[i%colors.length]+' '+(i*seg)+'deg '+((i+1)*seg)+'deg').join(', ');
  const spokes=members.map((m,i)=>{const a=i*seg+seg/2;return '<div class="wheel-spoke" style="transform:rotate('+(a-180)+'deg);height:122px"><span>'+esc(shortName(m.name))+'</span></div>'}).join('');
  return '<div class="wheel"><div class="wheel-rotate" id="wheel-rotate"><div class="wheel-face" style="background:conic-gradient('+stops+')"></div>'+spokes+'<div class="wheel-center">🎡</div></div></div>';
}
function calcRotation(idx,total){const seg=360/total;return 360*8+(360-(idx*seg+seg/2))}
function animateWheel(target){
  const el=document.getElementById('wheel-rotate');if(!el)return;
  el.style.transition='transform '+SPIN_DURATION+'ms cubic-bezier(0.15,0.7,0.25,1)';
  void el.offsetWidth;
  el.style.transform='rotate('+target+'deg)';
}
async function doSpin(kametiId,roundId){
  if(isSpinning)return;
  const k=activeKameti;
  const poolAmt=poolAmount(k);

  // DEMO MODE
  if(spinMode==='demo'){
    const pool=k.members.filter(m=>m.status==='approved');
    const winner=pool[Math.floor(Math.random()*pool.length)];
    const idx=pool.findIndex(m=>m.id===winner.id);
    isSpinning=true;render();
    setTimeout(()=>animateWheel(calcRotation(idx,pool.length)),100);
    setTimeout(()=>{
      isSpinning=false;demoResult={winnerId:winner.id};render();
      showCelebration(winner.name,poolAmt);
    },SPIN_DURATION);
    return;
  }

  // REAL SPIN — server picks winner
  try{
    const {data,error}=await supabase.rpc('spin_round',{p_round_id:roundId});
    if(error)throw error;
    const {winner_id,winner_name,winner_index,total}=data;
    isSpinning=true;render();
    const target=calcRotation(winner_index,total);
    if(spinChannel){
      spinChannel.send({type:'broadcast',event:'spin_start',payload:{targetRotation:target,duration:SPIN_DURATION,roundId}});
    }
    setTimeout(()=>animateWheel(target),100);
    setTimeout(async()=>{
      try{
        const {error:cErr}=await supabase.rpc('complete_spin',{p_round_id:roundId});
        if(cErr)throw cErr;
        if(spinChannel){
          spinChannel.send({type:'broadcast',event:'spin_result',payload:{winnerName:winner_name,poolAmt,roundId}});
        }
        isSpinning=false;demoResult={winnerId:winner_id};
        if(!celebratedRounds.has(roundId)){celebratedRounds.add(roundId);showCelebration(winner_name,poolAmt)}
        await loadKametiDetail(kametiId);render();
      }catch(e){isSpinning=false;toast(e.message,'error');render()}
    },SPIN_DURATION);
  }catch(e){toast(e.message,'error')}
}

function showCelebration(winnerName,amount){
  const existing=document.querySelector('.celebration-overlay');
  if(existing)existing.remove();
  const ov=document.createElement('div');
  ov.className='celebration-overlay';
  ov.innerHTML='<div class="celebration-confetti-container"></div>'+
    '<div class="celebration-content">'+
    '<div class="celebration-emoji">🎉</div>'+
    '<div class="celebration-label">✨ '+t('khushNaseeb')+' ✨</div>'+
    '<div class="celebration-name">'+esc(winnerName)+'</div>'+
    '<div class="celebration-msg">'+t('mubarak')+' — '+t('apkiKameti')+'</div>'+
    '<div class="celebration-amount">'+money(amount)+'</div></div>';
  document.body.appendChild(ov);
  createConfetti(ov.querySelector('.celebration-confetti-container'));
  speakUrdu(winnerName);
  setTimeout(()=>{ov.classList.add('out');setTimeout(()=>ov.remove(),600)},CELEBRATION_DURATION);
}
function createConfetti(container){
  const colors=['#fbbf24','#f59e0b','#ef4444','#ec4899','#8b5cf6','#06b6d4','#10b981','#84cc16','#f97316','#facc15'];
  for(let i=0;i<90;i++){
    const el=document.createElement('div');el.className='confetti';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration=(2.5+Math.random()*3)+'s';
    el.style.animationDelay=(Math.random()*2.5)+'s';
    el.style.width=(8+Math.random()*10)+'px';
    el.style.height=(8+Math.random()*10)+'px';
    el.style.borderRadius=Math.random()>0.5?'50%':'2px';
    container.appendChild(el);
  }
}
function speakUrdu(winnerName){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const text=winnerName+' آپ کو مبارک ہو، آپ کی کمیٹی نکل آئی ہے';
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang='ur-PK';utter.rate=0.82;utter.pitch=1.05;utter.volume=1;
    const voices=speechSynthesis.getVoices();
    const v=voices.find(x=>x.lang==='ur-PK')||voices.find(x=>x.lang.startsWith('ur'))||voices.find(x=>x.lang==='hi-IN')||voices.find(x=>x.lang==='en-IN');
    if(v)utter.voice=v;
    if(!voices.length){
      speechSynthesis.onvoiceschanged=()=>speechSynthesis.speak(utter);
      setTimeout(()=>{try{speechSynthesis.speak(utter)}catch(e){}},500);
    }else speechSynthesis.speak(utter);
  }catch(e){console.warn('TTS',e)}
}

/* ============================================================
   CHANNELS (Realtime + Presence + Spin Broadcast)
   ============================================================ */
function setupChannels(kametiId){
  teardownChannels();

  const dbCh=supabase.channel('kameti-'+kametiId)
    .on('postgres_changes',{event:'*',schema:'public',table:'rounds',filter:'kameti_id=eq.'+kametiId},async()=>{await loadKametiDetail(kametiId);render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'contributions'},async()=>{await loadKametiDetail(kametiId);render()})
    .subscribe();

  presenceChannel=supabase.channel('presence-'+kametiId,{config:{presence:{key:currentProfile.id}}});
  presenceChannel
    .on('presence',{event:'sync'},()=>{
      const state=presenceChannel.presenceState();
      const list=[];
      Object.values(state).forEach(arr=>arr.forEach(p=>{
        if(p.user_id&&!list.find(m=>m.user_id===p.user_id))list.push(p);
      }));
      onlineMembers=list;
      if(view.name==='kameti'&&(view.tab==='spin'||view.tab==='members'))render();
    })
    .subscribe(async(status)=>{
      if(status==='SUBSCRIBED')await presenceChannel.track({user_id:currentProfile.id,name:currentProfile.name,online_at:new Date().toISOString()});
    });

  spinChannel=supabase.channel('spin-'+kametiId,{config:{broadcast:{self:false}}});
  spinChannel
    .on('broadcast',{event:'spin_start'},({payload})=>{
      if(!isSpinning){isSpinning=true;render()}
      setTimeout(()=>animateWheel(payload.targetRotation),100);
    })
    .on('broadcast',{event:'spin_result'},async({payload})=>{
      if(!celebratedRounds.has(payload.roundId)){celebratedRounds.add(payload.roundId);showCelebration(payload.winnerName,payload.poolAmt)}
      isSpinning=false;await loadKametiDetail(kametiId);render();
    })
    .subscribe();

  realtimeSub=()=>{
    supabase.removeChannel(dbCh);
    if(presenceChannel)supabase.removeChannel(presenceChannel);
    if(spinChannel)supabase.removeChannel(spinChannel);
    presenceChannel=null;spinChannel=null;
  };
}
function teardownChannels(){
  if(realtimeSub){realtimeSub();realtimeSub=null}
  onlineMembers=[];
}

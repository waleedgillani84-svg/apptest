<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Gillani Call</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --input:#2a3942;
    --primary:#00a884; --green:#25d366; --red:#f15c6d; --yellow:#f0b429;
    --text:#e9edef; --text2:#8696a0; --border:#2a3942;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;user-select:none}
  #app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}

  /* BANNER */
  #banner{display:none;padding:10px 14px;font-size:12.5px;line-height:1.45;text-align:center;
    background:#7a1f2b;color:#fff;border-bottom:1px solid #000;flex-shrink:0}
  #banner.show{display:block}
  #banner b{color:var(--yellow)}

  /* BOOT LOG (bottom) */
  #boot-log{position:fixed;bottom:0;left:0;right:0;background:#000;color:#7dd3a0;
    font-family:monospace;font-size:10px;padding:3px 8px;z-index:99999;
    max-height:60px;overflow-y:auto;white-space:pre-wrap;line-height:1.3;
    max-width:480px;margin:0 auto;display:none}
  #boot-log.show{display:block}
  #boot-log .err{color:#f66}

  /* LOGIN */
  #login-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px;overflow-y:auto}
  .logo-wrap{text-align:center;margin-bottom:6px}
  .logo-icon{width:88px;height:88px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#25d366);display:inline-flex;
    align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(37,211,102,.35)}
  .logo-icon svg{width:44px;height:44px;fill:#fff}
  .logo-wrap h1{font-size:26px;font-weight:700;margin-top:16px}
  .logo-wrap p{color:var(--text2);font-size:14px;margin-top:4px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;color:var(--text2);font-weight:500;padding-left:4px}
  .field input{width:100%;padding:15px 16px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--input);color:var(--text);font-size:16px;outline:none;-webkit-appearance:none}
  .field input:focus{border-color:var(--primary)}
  .field input::placeholder{color:#5a6a7a}
  .btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
    background:var(--primary);transition:transform .1s;-webkit-appearance:none}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.65;cursor:wait}
  .btn-outline{background:transparent;border:1.5px solid var(--border)}
  .error-msg{color:var(--red);font-size:13px;text-align:center;min-height:18px}
  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.25);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* MAIN */
  #main-app{display:none;flex-direction:column;height:100%;flex:1;overflow:hidden;min-height:0}
  #main-app.active{display:flex}
  .app-header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  .app-header h1{font-size:20px;font-weight:700;color:var(--primary)}
  .user-badge{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;
    border-radius:50px;background:var(--panel2);cursor:pointer}
  .user-badge .avatar{width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#25d366);display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .user-badge .uname{font-size:13px;font-weight:600}

  .page{flex:1;overflow-y:auto;display:none;flex-direction:column;min-height:0}
  .page.active{display:flex}
  .page::-webkit-scrollbar{display:none}

  .dialer-wrap{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .dialer-display{background:var(--panel);border-radius:14px;padding:18px;
    text-align:center;border:1.5px solid var(--border)}
  .dialer-display:focus-within{border-color:var(--primary)}
  .dialer-display input{width:100%;background:transparent;border:none;color:var(--text);
    font-size:24px;text-align:center;outline:none;letter-spacing:2px;-webkit-appearance:none}
  .dialer-display input::placeholder{color:#5a6a7a;font-size:16px;letter-spacing:0}
  .call-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .call-action-btn{padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:600;
    color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    transition:transform .1s;-webkit-appearance:none}
  .call-action-btn:active{transform:scale(.96)}
  .call-action-btn.audio{background:var(--green)}
  .call-action-btn.video{background:var(--primary)}
  .call-action-btn svg{width:20px;height:20px;fill:#fff}

  .section-title{font-size:13px;font-weight:600;color:var(--text2);
    text-transform:uppercase;letter-spacing:.6px;padding:12px 16px 8px}

  .recent-item{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
  .recent-item:active{background:var(--panel2)}
  .recent-item .rc-icon{width:42px;height:42px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .recent-item .rc-icon svg{width:18px;height:18px}
  .recent-item .rc-info{flex:1;min-width:0}
  .recent-item .rc-info .rc-name{font-size:15px;font-weight:500}
  .recent-item .rc-info .rc-sub{font-size:12px;color:var(--text2);margin-top:2px}
  .recent-item .rc-time{font-size:11px;color:var(--text2)}

  .contacts-toolbar{display:flex;gap:10px;padding:12px 16px}
  .contacts-toolbar input{flex:1;padding:11px 14px;border-radius:10px;
    border:1.5px solid var(--border);background:var(--input);color:var(--text);
    font-size:14px;outline:none;-webkit-appearance:none}
  .contacts-toolbar .add-btn{width:44px;height:44px;border-radius:10px;background:var(--primary);
    color:#fff;border:none;font-size:22px;cursor:pointer;flex-shrink:0;line-height:1}

  .contact-item{display:flex;align-items:center;gap:14px;padding:12px 16px}
  .contact-item .avatar-wrap{position:relative;flex-shrink:0}
  .contact-item .avatar{width:48px;height:48px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
  .contact-item .status-dot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;
    border-radius:50%;border:2.5px solid var(--bg)}
  .status-dot.online{background:var(--green)}
  .status-dot.offline{background:#5a6a7a}
  .contact-item .info{flex:1;min-width:0}
  .contact-item .info .name{font-size:16px;font-weight:500}
  .contact-item .info .number{font-size:13px;color:var(--text2);margin-top:2px}
  .contact-item .actions{display:flex;gap:6px;flex-shrink:0}
  .contact-item .actions button{width:38px;height:38px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .contact-item .actions button svg{width:16px;height:16px}
  .action-audio{background:rgba(37,211,102,.18);color:var(--green)}
  .action-audio svg{fill:var(--green)}
  .action-video{background:rgba(0,168,132,.18);color:var(--primary)}
  .action-video svg{fill:var(--primary)}
  .action-delete{background:rgba(241,92,109,.15);color:var(--red)}
  .action-delete svg{fill:var(--red)}

  .empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
  .empty-state .big{font-size:52px;margin-bottom:14px;opacity:.35;display:block}
  .empty-state p{font-size:14px;line-height:1.5}

  .bottom-tabs{display:flex;background:var(--panel);border-top:1px solid var(--border);
    padding:4px 0 calc(4px + env(safe-area-inset-bottom,0));flex-shrink:0}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 0;color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;
    border:none;background:transparent}
  .tab-item svg{width:22px;height:22px;fill:currentColor}
  .tab-item.active{color:var(--primary)}

  /* CALL SCREEN */
  #call-screen{position:fixed;inset:0;background:linear-gradient(180deg,#0b141a,#0d1b22);
    z-index:900;display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-top:14px}
  #call-screen.active{display:flex}
  .call-top{padding:20px;text-align:center;flex-shrink:0}
  .call-status{font-size:12px;color:var(--text2);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1px}
  .call-name{font-size:26px;font-weight:600;margin-bottom:4px}
  .call-number{font-size:14px;color:var(--text2)}
  .call-timer{font-size:16px;color:var(--green);font-weight:600;margin-top:8px;
    font-variant-numeric:tabular-nums;letter-spacing:1px}
  .call-body{flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;min-height:0}
  .audio-avatar{width:140px;height:140px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#25d366);display:flex;
    align-items:center;justify-content:center;font-size:56px;font-weight:700;color:#fff;
    animation:pulse 2.2s infinite}
  @keyframes pulse{
    0%{transform:scale(1);box-shadow:0 0 0 0 rgba(37,211,102,.5)}
    70%{transform:scale(1.04);box-shadow:0 0 0 26px rgba(37,211,102,0)}
    100%{transform:scale(1);box-shadow:0 0 0 0 rgba(37,211,102,0)}
  }
  .video-wrap{position:absolute;inset:0;background:#000;display:none}
  .video-wrap.active{display:block}
  #remote-video{width:100%;height:100%;object-fit:cover;background:#000}
  #local-video{position:absolute;top:16px;right:16px;width:100px;height:140px;
    border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.2);
    z-index:4;background:#1a1f2e}
  .call-controls{padding:20px 24px calc(32px + env(safe-area-inset-bottom,0));
    display:flex;justify-content:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
  .ctrl-btn{width:60px;height:60px;border-radius:50%;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;color:#fff;
    background:rgba(255,255,255,.14);transition:transform .1s}
  .ctrl-btn svg{width:24px;height:24px;fill:#fff}
  .ctrl-btn:active{transform:scale(.9)}
  .ctrl-btn.toggled{background:#fff}
  .ctrl-btn.toggled svg{fill:#0b141a}
  .ctrl-btn.end{background:var(--red)}

  /* INCOMING */
  #incoming-overlay{position:fixed;inset:0;background:linear-gradient(180deg,#0a1620,#0d1b22);
    z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:32px;max-width:480px;margin:0 auto}
  #incoming-overlay.active{display:flex}
  .inc-avatar{width:120px;height:120px;border-radius:50%;
    background:linear-gradient(135deg,#00a884,#25d366);display:flex;align-items:center;
    justify-content:center;font-size:48px;font-weight:700;color:#fff;
    animation:pulse 1.6s infinite}
  .inc-label{font-size:13px;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
  .inc-name{font-size:28px;font-weight:600}
  .inc-number{font-size:15px;color:var(--text2)}
  .inc-type{font-size:13px;color:var(--primary);text-transform:uppercase;letter-spacing:1px}
  .inc-actions{display:flex;gap:56px;margin-top:24px}
  .inc-actions button{width:68px;height:68px;border-radius:50%;border:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .inc-actions button svg{width:28px;height:28px;fill:#fff}
  .btn-accept{background:var(--green)}
  .btn-decline{background:var(--red)}

  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);color:var(--text);padding:12px 22px;border-radius:50px;
    font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.6);opacity:0;transition:all .3s;
    z-index:2000;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1500;
    display:none;align-items:center;justify-content:center;padding:24px;
    max-width:480px;margin:0 auto}
  .modal-overlay.active{display:flex}
  .modal{background:var(--panel);border-radius:14px;padding:24px;
    width:100%;border:1px solid var(--border)}
  .modal h3{font-size:18px;margin-bottom:16px}
  .modal .field{margin-bottom:14px}
  .modal .btn-row{display:flex;gap:10px;margin-top:20px}
  .modal .btn-row .btn{flex:1}
</style>
</head>
<body>

<div id="app">

  <!-- BANNER (visible only when not HTTPS) -->
  <div id="banner"></div>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/>
        </svg>
      </div>
      <h1>Gillani Call</h1>
      <p>Audio & Video Calling</p>
    </div>
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="login-name" placeholder="e.g. Junaid Gillani" autocomplete="off" />
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="login-phone" placeholder="e.g. 03176407904" autocomplete="off" inputmode="tel" />
    </div>
    <div class="error-msg" id="login-error"></div>
    <button class="btn" id="login-btn" type="button">
      <span>Login</span>
    </button>
    <p style="text-align:center;font-size:12px;color:var(--text2);margin-top:8px">
      Naam aur number likh kar login karein
    </p>
  </div>

  <!-- MAIN APP -->
  <div id="main-app">
    <div class="app-header">
      <h1>Gillani Call</h1>
      <div class="user-badge" id="user-badge">
        <div class="avatar" id="user-avatar">?</div>
        <span class="uname" id="user-display-name">User</span>
      </div>
    </div>

    <div class="page active" id="page-dialer">
      <div class="dialer-wrap">
        <div class="dialer-display">
          <input type="tel" id="dial-input" placeholder="Enter phone number" inputmode="tel" />
        </div>
        <div class="call-actions">
          <button class="call-action-btn audio" id="call-audio-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
            Audio
          </button>
          <button class="call-action-btn video" id="call-video-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            Video
          </button>
        </div>
      </div>
      <div class="section-title">Recent Calls</div>
      <div id="recent-list"></div>
    </div>

    <div class="page" id="page-contacts">
      <div class="contacts-toolbar">
        <input type="text" id="contact-search" placeholder="Search contacts..." />
        <button class="add-btn" id="add-contact-btn" type="button">+</button>
      </div>
      <div id="contacts-list"></div>
    </div>

    <div class="bottom-tabs">
      <button class="tab-item active" data-page="dialer" type="button">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
        <span>Dialer</span>
      </button>
      <button class="tab-item" data-page="contacts" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
        <span>Contacts</span>
      </button>
    </div>
  </div>
</div>

<!-- CALL SCREEN -->
<div id="call-screen">
  <div class="call-top">
    <div class="call-status" id="call-status">Connecting</div>
    <div class="call-name" id="call-name">Unknown</div>
    <div class="call-number" id="call-number">---</div>
    <div class="call-timer" id="call-timer"></div>
  </div>
  <div class="call-body">
    <div class="audio-avatar" id="call-avatar">?</div>
    <div class="video-wrap" id="video-wrap">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
  </div>
  <div class="call-controls">
    <button class="ctrl-btn" id="btn-mute" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.7 0 3-1.3 3-3V5c0-1.7-1.3-3-3-3S9 3.3 9 5v6c0 1.7 1.3 3 3 3zm5-3c0 2.8-2.2 5-5 5s-5-2.2-5-5H5c0 3.5 2.6 6.4 6 6.9V21h2v-3.1c3.4-.5 6-3.4 6-6.9h-2z"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-speaker" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
    </button>
    <button class="ctrl-btn" id="btn-switch-cam" type="button" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M20 5h-3l-2-2H9L7 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm3-5l-4-3v6l4-3z"/></svg>
    </button>
    <button class="ctrl-btn end" id="btn-end" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
  </div>
</div>

<!-- INCOMING -->
<div id="incoming-overlay">
  <div class="inc-label">Incoming Call</div>
  <div class="inc-avatar" id="incoming-avatar">?</div>
  <div class="inc-name" id="incoming-name">Unknown</div>
  <div class="inc-number" id="incoming-number">---</div>
  <div class="inc-type" id="incoming-type">Audio Call</div>
  <div class="inc-actions">
    <button class="btn-decline" id="btn-decline" type="button">

/* ============================================================
   PRESENCE
   ============================================================ */
function connectPresence(){
  if(!supabase || !currentUser) return;
  try {
    if(presenceChannel) supabase.removeChannel(presenceChannel);
    presenceChannel = supabase.channel('gc-presence-v5', {
      config: { presence: { key: currentUser.phone } }
    });
    presenceChannel
      .on('presence', { event: 'sync' }, function(){
        var st = presenceChannel.presenceState();
        onlineUsers = {};
        Object.keys(st).forEach(function(k){
          st[k].forEach(function(p){ if(p.phone) onlineUsers[p.phone] = true; });
        });
        renderContacts();
      })
      .on('presence', { event: 'join' }, function(p){
        (p.newPresences||[]).forEach(function(u){ if(u.phone) onlineUsers[u.phone] = true; });
        renderContacts();
      })
      .on('presence', { event: 'leave' }, function(p){
        (p.leftPresences||[]).forEach(function(u){ if(u.phone) delete onlineUsers[u.phone]; });
        renderContacts();
      })
      .subscribe(function(status){
        boot('presence: ' + status);
        if(status === 'SUBSCRIBED'){
          presenceReady = true;
          presenceChannel.track({
            phone: currentUser.phone, name: currentUser.name,
            online_at: new Date().toISOString()
          });
        }
      });
  } catch(e){ boot('presence setup: ' + e.message, true); }
}

/* ============================================================
   SIGNALING
   ============================================================ */
function connectSignaling(){
  if(!supabase || !currentUser) return;
  try {
    if(signalChannel) supabase.removeChannel(signalChannel);
    signalReady = false;
    signalChannel = supabase.channel('gc-signals-v5', {
      config: { broadcast: { self: false } }
    });
    signalChannel
      .on('broadcast', { event: 'signal' }, function(r){
        if(!r.payload || r.payload.to !== currentUser.phone) return;
        processIncoming(r.payload);
      })
      .subscribe(function(status){
        boot('signal: ' + status);
        if(status === 'SUBSCRIBED') signalReady = true;
      });
  } catch(e){ boot('signal setup: ' + e.message, true); }
}

function sendSignal(to, type, data){
  if(!supabase || !currentUser) return;
  data = data || {};
  var msgId = uuid();

  // DB insert (reliable)
  supabase.from('gc_signals').insert({
    to_phone: to, from_phone: currentUser.phone, from_name: currentUser.name,
    signal_type: type, payload: Object.assign({ msgId: msgId }, data)
  }).then(function(r){
    if(r.error) boot('signal insert: ' + r.error.message, true);
  });

  // Broadcast (fast)
  if(signalChannel && signalReady){
    try {
      signalChannel.send({
        type: 'broadcast', event: 'signal',
        payload: Object.assign({
          to: to, from: currentUser.phone, fromName: currentUser.name,
          signalType: type, msgId: msgId
        }, data)
      });
    } catch(e){}
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollSignals, 900);
  pollSignals();
}

function pollSignals(){
  if(!supabase || !currentUser) return;
  supabase.from('gc_signals').select('*')
    .eq('to_phone', currentUser.phone)
    .order('created_at', { ascending: true })
    .limit(15)
    .then(function(r){
      if(r.error || !r.data || !r.data.length) return;
      r.data.forEach(function(sig){
        supabase.from('gc_signals').delete().eq('id', sig.id).then(function(){});
        if(Date.now() - new Date(sig.created_at).getTime() > 90000) return;
        var pl = sig.payload || {};
        processIncoming({
          to: sig.to_phone, from: sig.from_phone, fromName: sig.from_name,
          signalType: sig.signal_type, msgId: pl.msgId, sdp: pl.sdp,
          candidate: pl.candidate, type: pl.type,
          callerName: pl.callerName, callerPhone: pl.callerPhone
        });
      });
    });
}

function processIncoming(msg){
  if(!msg || !msg.signalType) return;
  if(msg.msgId){
    if(seenMsgIds[msg.msgId]) return;
    seenMsgIds[msg.msgId] = true;
  }
  boot('signal ← ' + msg.signalType + ' from ' + msg.from);
  if(msg.signalType === 'offer') return handleOffer(msg);
  if(msg.signalType === 'answer') return handleAnswer(msg);
  if(msg.signalType === 'ice') return handleIce(msg);
  if(msg.signalType === 'end') return handleRemoteEnd();
  if(msg.signalType === 'reject') return handleReject();
  if(msg.signalType === 'cancel') return handleRemoteCancel();
}

/* ============================================================
   WEBRTC
   ============================================================ */
function createPC(){
  if(peerConnection){ try { peerConnection.close(); } catch(e){} }
  peerConnection = new RTCPeerConnection(ICE);
  if(localStream){
    localStream.getTracks().forEach(function(t){ peerConnection.addTrack(t, localStream); });
  }
  remoteStream = new MediaStream();
  peerConnection.ontrack = function(ev){
    ev.streams[0].getTracks().forEach(function(t){
      if(!remoteStream.getTracks().find(function(x){ return x.id === t.id; })){
        remoteStream.addTrack(t);
      }
    });
    var rv = $('remote-video');
    if(rv && rv.srcObject !== remoteStream){
      rv.srcObject = remoteStream;
      rv.play().catch(function(){});
    }
  };
  peerConnection.onicecandidate = function(ev){
    if(ev.candidate && currentCall){
      var target = currentCall.role === 'caller' ? currentCall.targetPhone : currentCall.callerPhone;
      sendSignal(target, 'ice', { candidate: ev.candidate });
    }
  };
  peerConnection.onconnectionstatechange = function(){
    var st = peerConnection.connectionState;
    boot('pc state: ' + st);
    if(st === 'connected') $('call-status').textContent = 'Connected';
    else if(st === 'disconnected' || st === 'failed') endCall(false);
  };
  return peerConnection;
}

function getMedia(type){
  return new Promise(function(resolve, reject){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return reject(new Error('Camera/Mic needs HTTPS. Host app on netlify.com/drop'));
    }
    var c = {
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: type === 'video'
        ? { facingMode: isFrontCamera ? 'user' : 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        : false
    };
    navigator.mediaDevices.getUserMedia(c).then(function(s){
      localStream = s; resolve(s);
    }, reject);
  });
}

function drainIce(){
  if(!peerConnection || !peerConnection.remoteDescription) return;
  while(pendingIce.length){
    var c = pendingIce.shift();
    try { peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
  }
}

/* ============================================================
   CALLER
   ============================================================ */
function startCall(phone, name, type){
  if(!currentUser) return;
  phone = normPhone(phone);
  if(!phone){ toast('Enter phone number'); return; }
  if(phone === currentUser.phone){ toast('Cannot call yourself'); return; }
  if(currentCall){ toast('Already in call'); return; }
  if(!supabase){ toast('Supabase not ready -- host on HTTPS'); return; }

  var c = contacts.find(function(x){ return x.phone === phone; });
  if(c) name = c.name;

  currentCall = {
    targetPhone: phone, targetName: name || phone,
    callerPhone: currentUser.phone, callerName: currentUser.name,
    type: type, role: 'caller'
  };

  showCallScreen();
  $('call-status').textContent = 'Calling...';
  $('call-name').textContent = currentCall.targetName;
  $('call-number').textContent = phone;
  $('call-avatar').textContent = initials(currentCall.targetName);

  getMedia(type).then(function(){
    if(type === 'video') $('local-video').srcObject = localStream;
    createPC();
    return peerConnection.createOffer();
  }).then(function(offer){
    return peerConnection.setLocalDescription(offer).then(function(){
      return sendSignal(phone, 'offer', {
        sdp: offer, type: type,
        callerName: currentUser.name, callerPhone: currentUser.phone
      });
    });
  }).then(function(){
    boot('offer sent to ' + phone);
    ringTimeout = setTimeout(function(){
      if(currentCall && currentCall.role === 'caller'){ toast('No answer'); endCall(true); }
    }, 60000);
  }).catch(function(e){
    boot('startCall error: ' + e.message, true);
    toast(e.message); endCall(true);
  });
}

/* ============================================================
   CALLEE
   ============================================================ */
function handleOffer(msg){
  if(currentCall){ sendSignal(msg.from, 'reject', {}); return; }
  currentCall = {
    callerPhone: msg.from, callerName: msg.callerName || 'Unknown',
    targetPhone: currentUser.phone, type: msg.type || 'audio',
    role: 'callee', pendingOffer: msg.sdp
  };
  $('incoming-avatar').textContent = initials(msg.callerName || msg.from);
  $('incoming-name').textContent = msg.callerName || 'Unknown';
  $('incoming-number').textContent = msg.from;
  $('incoming-type').textContent = (msg.type === 'video' ? 'Video' : 'Audio') + ' Call';
  $('incoming-overlay').classList.add('active');
  playRingtone();
  if(navigator.vibrate) navigator.vibrate([500,300,500,300,500]);
  boot('incoming shown');
}

function acceptCall(){
  stopRingtone();
  $('incoming-overlay').classList.remove('active');
  if(!currentCall || !currentCall.pendingOffer) return;

  showCallScreen();
  $('call-status').textContent = 'Connecting...';
  $('call-name').textContent = currentCall.callerName;
  $('call-number').textContent = currentCall.callerPhone;
  $('call-avatar').textContent = initials(currentCall.callerName);

  getMedia(currentCall.type).then(function(){
    if(currentCall.type === 'video') $('local-video').srcObject = localStream;
    createPC();
    return peerConnection.setRemoteDescription(new RTCSessionDescription(currentCall.pendingOffer));
  }).then(function(){
    drainIce();
    return peerConnection.createAnswer();
  }).then(function(answer){
    return peerConnection.setLocalDescription(answer).then(function(){
      return sendSignal(currentCall.callerPhone, 'answer', { sdp: answer });
    });
  }).then(function(){
    startTimer();
    $('call-status').textContent = 'Connected';
    boot('answer sent');
  }).catch(function(e){
    boot('accept error: ' + e.message, true);
    toast(e.message); endCall(true);
  });
}

function handleAnswer(msg){
  if(!peerConnection || !currentCall || currentCall.role !== 'caller') return;
  peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp))
    .then(function(){
      drainIce();
      if(ringTimeout){ clearTimeout(ringTimeout); ringTimeout = null; }
      startTimer();
      $('call-status').textContent = 'Connected';
    }).catch(function(e){ boot('answer err: ' + e.message, true); });
}

function handleIce(msg){
  if(!peerConnection || !msg.candidate) return;
  if(!peerConnection.remoteDescription){ pendingIce.push(msg.candidate); return; }
  peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(function(){});
}

function handleReject(){ toast('Call declined'); endCall(true); }
function handleRemoteEnd(){ toast('Call ended'); endCall(false); }
function handleRemoteCancel(){
  toast('Call cancelled'); stopRingtone();
  $('incoming-overlay').classList.remove('active');
  if(currentCall && currentCall.role === 'callee') currentCall = null;
}

/* ============================================================
   UI
   ============================================================ */
function showCallScreen(){
  $('call-screen').classList.add('active');
  if(currentCall.type === 'video'){
    $('video-wrap').classList.add('active');
    $('call-avatar').style.display = 'none';
    $('btn-switch-cam').style.display = 'flex';
  } else {
    $('video-wrap').classList.remove('active');
    $('call-avatar').style.display = 'flex';
    $('btn-switch-cam').style.display = 'none';
  }
  isMuted = false; isSpeakerOn = false;
  $('btn-mute').classList.remove('toggled');
  $('btn-speaker').classList.remove('toggled');
  $('call-timer').textContent = '';
}

function startTimer(){
  callSeconds = 0;
  clearInterval(callTimer);
  callTimer = setInterval(function(){
    callSeconds++;
    $('call-timer').textContent = fmtTime(callSeconds);
  }, 1000);
}

function endCall(userInit){
  if(userInit === undefined) userInit = true;
  clearInterval(callTimer);
  clearTimeout(ringTimeout); ringTimeout = null;
  stopRingtone();
  if(currentCall && userInit){
    var target = currentCall.role === 'caller' ? currentCall.targetPhone : currentCall.callerPhone;
    var evt = (currentCall.role === 'caller' && callSeconds === 0) ? 'cancel' : 'end';
    sendSignal(target, evt, {});
  }
  if(currentCall){
    var n = currentCall.role === 'caller' ? currentCall.targetName : currentCall.callerName;
    var p = currentCall.role === 'caller' ? currentCall.targetPhone : currentCall.callerPhone;
    addRecent(n || p, p, currentCall.type);
    if(supabase){
      supabase.from('gc_calls').insert({
        caller_phone: currentCall.callerPhone || currentUser.phone,
        callee_phone: currentCall.targetPhone || currentUser.phone,
        call_type: currentCall.type,
        status: callSeconds > 0 ? 'ended' : 'missed',
        ended_at: new Date().toISOString(),
        duration_seconds: callSeconds
      }).then(function(){});
    }
  }
  if(peerConnection){ try { peerConnection.close(); } catch(e){} peerConnection = null; }
  if(localStream){ localStream.getTracks().forEach(function(t){ t.stop(); }); localStream = null; }
  remoteStream = null; pendingIce = [];
  $('call-screen').classList.remove('active');
  $('incoming-overlay').classList.remove('active');
  $('remote-video').srcObject = null;
  $('local-video').srcObject = null;
  currentCall = null; callSeconds = 0;
}

/* ============================================================
   CONTROLS
   ============================================================ */
function toggleMute(){
  if(!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(function(t){ t.enabled = !isMuted; });
  $('btn-mute').classList.toggle('toggled', isMuted);
}

function toggleSpeaker(){
  isSpeakerOn = !isSpeakerOn;
  $('btn-speaker').classList.toggle('toggled', isSpeakerOn);
  toast(isSpeakerOn ? 'Speaker ON' : 'Speaker OFF');
}

function switchCamera(){
  if(!localStream || !currentCall || currentCall.type !== 'video') return;
  isFrontCamera = !isFrontCamera;
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: isFrontCamera ? 'user' : 'environment' }
  }).then(function(ns){
    var nv = ns.getVideoTracks()[0];
    var sender = peerConnection.getSenders().find(function(s){ return s.track && s.track.kind === 'video'; });
    if(sender) sender.replaceTrack(nv);
    var ov = localStream.getVideoTracks()[0];
    if(ov){ ov.stop(); localStream.removeTrack(ov); }
    localStream.addTrack(nv);
    $('local-video').srcObject = localStream;
  }).catch(function(){ toast('Camera switch failed'); });
}

/* ============================================================
   RINGTONE
   ============================================================ */
function playRingtone(){
  try {
    ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    var beep = function(){
      if(!ringtoneCtx) return;
      var o = ringtoneCtx.createOscillator(), g = ringtoneCtx.createGain();
      o.connect(g); g.connect(ringtoneCtx.destination);
      o.frequency.value = 540; o.type = 'sine';
      g.gain.setValueAtTime(0.18, ringtoneCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ringtoneCtx.currentTime + 0.5);
      o.start(); o.stop(ringtoneCtx.currentTime + 0.6);
    };
    beep();
    ringtoneInterval = setInterval(beep, 1800);
  } catch(e){}
}
function stopRingtone(){
  if(ringtoneInterval){ clearInterval(ringtoneInterval); ringtoneInterval = null; }
  if(ringtoneCtx){ try { ringtoneCtx.close(); } catch(e){} ringtoneCtx = null; }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderContacts(){
  var list = $('contacts-list'); if(!list) return;
  var q = ($('contact-search').value || '').toLowerCase();
  var f = q ? contacts.filter(function(c){
    return c.name.toLowerCase().indexOf(q) !== -1 || c.phone.indexOf(q) !== -1;
  }) : contacts;

  if(f.length === 0){
    list.innerHTML = '<div class="empty-state"><span class="big">📇</span><p>' +
      (contacts.length ? 'No matching contacts' : 'No contacts yet.<br/>Tap + to add one.') +
      '</p></div>';
    return;
  }

  var html = '';
  f.forEach(function(c){
    var on = !!onlineUsers[c.phone];
    var sn = esc(c.name);
    html += '<div class="contact-item">' +
      '<div class="avatar-wrap">' +
        '<div class="avatar" style="background:linear-gradient(135deg,' +
          (on ? '#25d366,#00a884' : '#4a5878,#2a3350') + ')">' + initials(c.name) + '</div>' +
        '<div class="status-dot ' + (on ? 'online' : 'offline') + '"></div>' +
      '</div>' +
      '<div class="info">' +
        '<div class="name">' + c.name + '</div>' +
        '<div class="number">' + c.phone + ' · ' + (on ? 'Online' : 'Offline') + '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="action-audio" onclick="startCallFromContact(\'' + c.phone + '\',\'' + sn + '\',\'audio\')">' +
          '<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>' +
        '</button>' +
        '<button class="action-video" onclick="startCallFromContact(\'' + c.phone + '\',\'' + sn + '\',\'video\')">' +
          '<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>' +
        '</button>' +
        '<button class="action-delete" onclick="deleteContact(\'' + c.phone + '\')">' +
          '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

function startCallFromContact(phone, name, type){ startCall(phone, name, type); }

function deleteContact(phone){
  contacts = contacts.filter(function(c){ return c.phone !== phone; });
  saveContacts(); renderContacts();
  if(supabase && currentUser){
    supabase.from('gc_contacts').delete()
      .eq('owner_phone', currentUser.phone)
      .eq('contact_phone', phone)
      .then(function(){});
  }
  toast('Contact deleted');
}

function renderRecent(){
  var list = $('recent-list'); if(!list) return;
  if(recentCalls.length === 0){
    list.innerHTML = '<div class="empty-state"><span class="big">📞</span><p>No recent calls</p></div>';
    return;
  }
  var html = '';
  recentCalls.forEach(function(r){
    var color = r.type === 'video' ? '#00a884' : '#25d366';
    var icon = r.type === 'video'
      ? '<svg viewBox="0 0 24 24" style="fill:'+color+'"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>'
      : '<svg viewBox="0 0 24 24" style="fill:'+color+'"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>';
    html += '<div class="recent-item" onclick="startCallFromContact(\'' + r.phone + '\',\'' + esc(r.name) + '\',\'' + r.type + '\')">' +
      '<div class="rc-icon" style="background:' + color + '22">' + icon + '</div>' +
      '<div class="rc-info"><div class="rc-name">' + r.name + '</div>' +
        '<div class="rc-sub">' + (r.type === 'video' ? 'Video' : 'Audio') + ' call</div></div>' +
      '<div class="rc-time">' + ago(r.time) + '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

function switchPage(p){
  document.querySelectorAll('.page').forEach(function(x){ x.classList.remove('active'); });
  document.querySelectorAll('.tab-item').forEach(function(x){ x.classList.remove('active'); });
  var el = $('page-'+p); if(el) el.classList.add('active');
  var tab = document.querySelector('.tab-item[data-page="' + p + '"]');
  if(tab) tab.classList.add('active');
}

/* ============================================================
   EVENTS
   ============================================================ */
function attachEvents(){
  boot('attaching events');

  var loginBtn = $('login-btn');
  if(loginBtn) loginBtn.addEventListener('click', handleLogin);

  var loginPhone = $('login-phone');
  if(loginPhone) loginPhone.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleLogin();
  });

  var loginName = $('login-name');
  if(loginName) loginName.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && loginPhone) loginPhone.focus();
  });

  document.querySelectorAll('.tab-item').forEach(function(b){
    b.addEventListener('click', function(){ switchPage(b.dataset.page); });
  });

  var badge = $('user-badge');
  if(badge) badge.addEventListener('click', function(){
    if(!confirm('Logout?')) return;
    try { if(presenceChannel && supabase) supabase.removeChannel(presenceChannel); } catch(e){}
    try { if(signalChannel && supabase) supabase.removeChannel(signalChannel); } catch(e){}
    if(pollTimer) clearInterval(pollTimer);
    store.del('gc_user');
    location.reload();
  });

  var audioBtn = $('call-audio-btn');
  if(audioBtn) audioBtn.addEventListener('click', function(){
    var n = $('dial-input').value.trim();
    if(!n){ toast('Enter phone number'); return; }
    startCall(n, null, 'audio');
  });

  var videoBtn = $('call-video-btn');
  if(videoBtn) videoBtn.addEventListener('click', function(){
    var n = $('dial-input').value.trim();
    if(!n){ toast('Enter phone number'); return; }
    startCall(n, null, 'video');
  });

  var addBtn = $('add-contact-btn');
  if(addBtn) addBtn.addEventListener('click', function(){
    $('new-contact-name').value = '';
    $('new-contact-number').value = '';
    $('add-contact-modal').classList.add('active');
  });

  var cancelAdd = $('cancel-add-contact');
  if(cancelAdd) cancelAdd.addEventListener('click', function(){
    $('add-contact-modal').classList.remove('active');
  });

  var saveContact = $('save-contact');
  if(saveContact) saveContact.addEventListener('click', function(){
    var name = $('new-contact-name').value.trim();
    var phone = normPhone($('new-contact-number').value.trim());
    if(!name || !phone){ toast('Fill both fields'); return; }
    if(contacts.some(function(c){ return c.phone === phone; })){ toast('Already exists'); return; }
    contacts.push({ name: name, phone: phone });
    saveContacts(); renderContacts();
    $('add-contact-modal').classList.remove('active');
    toast('Contact saved');
    if(supabase && currentUser){
      supabase.from('gc_contacts').upsert(
        { owner_phone: currentUser.phone, contact_phone: phone, contact_name: name },
        { onConflict: 'owner_phone,contact_phone' }
      ).then(function(r){ if(r.error) boot('save contact: ' + r.error.message, true); });
    }
  });

  var search = $('contact-search');
  if(search) search.addEventListener('input', renderContacts);

  var mute = $('btn-mute');
  if(mute) mute.addEventListener('click', toggleMute);
  var spk = $('btn-speaker');
  if(spk) spk.addEventListener('click', toggleSpeaker);
  var swCam = $('btn-switch-cam');
  if(swCam) swCam.addEventListener('click', switchCamera);
  var endBtn = $('btn-end');
  if(endBtn) endBtn.addEventListener('click', function(){ endCall(true); });

  var accept = $('btn-accept');
  if(accept) accept.addEventListener('click', acceptCall);
  var decline = $('btn-decline');
  if(decline) decline.addEventListener('click', function(){
    stopRingtone();
    $('incoming-overlay').classList.remove('active');
    if(currentCall) sendSignal(currentCall.callerPhone, 'reject', {});
    currentCall = null;
  });

  // Init supabase if already loaded
  tryInitSupabase();

  // Try auto-login
  tryAutoLogin();
}

/* ============================================================
   BOOT
   ============================================================ */
try {
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', attachEvents);
  } else {
    attachEvents();
  }
} catch(e){
  boot('BOOT FAILED: ' + e.message, true);
}

window.addEventListener('beforeunload', function(){
  try { if(presenceChannel && supabase) supabase.removeChannel(presenceChannel); } catch(e){}
  try { if(signalChannel && supabase) supabase.removeChannel(signalChannel); } catch(e){}
  if(pollTimer) clearInterval(pollTimer);
});

window.startCallFromContact = startCallFromContact;
window.deleteContact = deleteContact;
</script>
</body>

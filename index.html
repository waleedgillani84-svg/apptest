<style>
:root {
  --bg: #0B1120; --surface: #151E32; --surface-light: #1E293B;
  --primary: #10B981; --primary-dark: #059669; --primary-glow: rgba(16,185,129,0.3);
  --text: #F8FAFC; --text-muted: #94A3B8; --border: #1E293B;
  --danger: #EF4444; --warning: #F59E0B; --gold: #FBBF24;
  --radius-lg: 24px; --radius-md: 16px; --radius-sm: 12px;
  --shadow-3d: 0 10px 30px -10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.3);
  --shadow-btn: 0 4px 15px rgba(16,185,129,0.4), inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.2);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: #000; color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
body[dir="rtl"] { direction: rtl; }

/* LOADING SCREEN */
#loading { position: fixed; inset: 0; background: #0B1120; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: var(--text); }
.spinner { width: 50px; height: 50px; border: 4px solid rgba(16,185,129,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-weight: 600; color: var(--text-muted); font-size: 14px; }

#app-wrapper { display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); }

/* APP HEADER */
.app-header { background: rgba(11,17,32,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: calc(var(--safe-top) + 16px) 20px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10; flex-shrink: 0; position: absolute; top: 0; left: 0; right: 0; }
.header-title { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
.lang-switch { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; border: 1px solid rgba(255,255,255,0.1); }
.lang-switch button { border: none; background: transparent; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 11px; color: var(--text-muted); cursor: pointer; transition: .2s; }
.lang-switch button.on { background: var(--surface-light); color: var(--text); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

/* APP CONTENT */
#app-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 70px) 16px calc(100px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; background: radial-gradient(circle at top, #1E293B 0%, var(--bg) 50%); }
#app-content::-webkit-scrollbar { display: none; }

/* When auth (logged out) - full screen */
#app-wrapper.auth-mode .app-header,
#app-wrapper.auth-mode .bottom-nav,
#app-wrapper.auth-mode .fab { display: none !important; }
#app-wrapper.auth-mode #app-content { padding: 0; background: radial-gradient(circle at top, #1E293B, #0B1120); }

/* BOTTOM NAV */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(21,30,50,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; padding: 10px 10px calc(var(--safe-bottom) + 10px); z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 6px 16px; border-radius: 12px; transition: .2s; }
.nav-item svg { width: 24px; height: 24px; stroke-width: 2; transition: .2s; }
.nav-item.on { color: var(--primary); }
.nav-item.on svg { stroke: var(--primary); transform: translateY(-2px); filter: drop-shadow(0 4px 6px var(--primary-glow)); }

/* 3D CARDS */
.card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-3d); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); }
.page-title { font-size: 26px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.8px; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; font-weight: 500; }

/* 3D BUTTONS */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 20px; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 15px; cursor: pointer; transition: .1s; width: 100%; position: relative; }
.btn:active { transform: translateY(2px); box-shadow: none !important; }
.btn.primary { background: linear-gradient(180deg, #10B981, #059669); color: #fff; box-shadow: var(--shadow-btn); text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.btn.primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn.danger { background: linear-gradient(180deg, #EF4444, #DC2626); color: #fff; box-shadow: 0 4px 15px rgba(239,68,68,0.3), inset 0 1px 0 rgba(255,255,255,0.3); }
.btn.outline { background: var(--surface-light); color: var(--text); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05); }
.btn.sm { padding: 10px 16px; font-size: 13px; border-radius: 10px; width: auto; }

/* KAMETI CARD */
.k-card { background: linear-gradient(145deg, #1E293B, #151E32); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); cursor: pointer; transition: .2s; position: relative; overflow: hidden; }
.k-card:active { transform: scale(0.98); }
.k-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); box-shadow: 0 0 15px var(--primary); }
.k-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.k-name { font-weight: 800; font-size: 18px; margin-bottom: 4px; letter-spacing: -0.3px; }
.k-meta { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.k-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.2); }
.k-badge.active { background: linear-gradient(180deg, #10B981, #059669); color: #fff; }
.k-badge.completed { background: linear-gradient(180deg, #3B82F6, #2563EB); color: #fff; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.03); }
.k-grid-item { display: flex; flex-direction: column; gap: 2px; }
.k-label { font-size: 9.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
.k-value { font-size: 14px; font-weight: 800; color: var(--text); }

/* FAB */
.fab { position: absolute; bottom: calc(var(--safe-bottom) + 90px); right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(180deg, #10B981, #059669); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 300; box-shadow: 0 10px 25px rgba(16,185,129,0.5), inset 0 2px 0 rgba(255,255,255,0.4); border: none; cursor: pointer; z-index: 40; transition: .2s; }
.fab:active { transform: scale(0.9) translateY(2px); }

/* FORMS */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
input, select { width: 100%; padding: 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); font-size: 15px; font-weight: 600; background: #0F172A; color: var(--text); transition: .2s; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
input:focus, select:focus { border-color: var(--primary); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 3px var(--primary-glow); }

/* AUTH SCREEN */
.auth-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
.auth-logo { width: 80px; height: 80px; background: linear-gradient(145deg, #10B981, #059669); color: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 24px; box-shadow: 0 15px 35px rgba(16,185,129,0.4), inset 0 2px 0 rgba(255,255,255,0.4); transform: rotate(-5deg); }
.auth-title { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
.auth-sub { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 30px; font-weight: 500; }

/* SEGMENTED */
.segmented { display: flex; background: #0F172A; padding: 5px; border-radius: var(--radius-md); margin-bottom: 20px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); overflow-x: auto; scrollbar-width: none; }
.segmented::-webkit-scrollbar { display: none; }
.segmented button { flex: 1; padding: 12px 10px; border: none; background: transparent; font-weight: 700; font-size: 13px; color: var(--text-muted); border-radius: 12px; cursor: pointer; transition: .2s; white-space: nowrap; }
.segmented button.on { background: var(--surface-light); color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }

/* MEMBER */
.m-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.m-item:last-child { border-bottom: none; }
.m-avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(145deg, #1E293B, #0F172A); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05); }
.m-info { flex: 1; }
.m-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.m-sub { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
.online-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--primary); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--primary-glow); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* WHEEL */
.wheel-container { position: relative; width: 270px; height: 270px; margin: 30px auto; }
.wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 10px #151E32, 0 0 0 14px var(--gold), inset 0 0 20px rgba(0,0,0,0.8); transition: transform 0s; }
.wheel-center { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; background: linear-gradient(145deg, #1E293B, #0F172A); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 4px solid var(--gold); z-index: 5; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.wheel-pointer { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 36px; color: var(--danger); z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.w-spoke { position: absolute; top: 50%; left: 50%; width: 0; transform-origin: 0 0; z-index: 2; pointer-events: none; }
.w-spoke span { position: absolute; bottom: 12px; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; letter-spacing: 0.5px; }

/* PRESENCE */
.presence-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
.presence-bar::-webkit-scrollbar { display: none; }
.p-chip { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: #0F172A; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05); white-space: nowrap; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
.p-chip.online { background: rgba(16,185,129,0.1); color: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px rgba(16,185,129,0.2); }

/* CELEBRATION */
.celebration { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at center, #F59E0B, #B45309); display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 20px; overflow: hidden; }
.cel-content { position: relative; z-index: 2; animation: popIn .8s cubic-bezier(.34,1.56,.64,1); width: 100%; }
@keyframes popIn { from { transform: scale(.5) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.cel-emoji { font-size: 90px; animation: bounce 1s infinite alternate; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); }
@keyframes bounce { to { transform: translateY(-20px) scale(1.1); } }
.cel-title { font-size: 22px; font-weight: 800; letter-spacing: 6px; margin: 20px 0 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; }
.cel-name { font-size: 48px; font-weight: 900; margin: 10px 0; text-shadow: 0 8px 25px rgba(0,0,0,0.4); line-height: 1.1; }
.cel-msg { font-size: 22px; font-weight: 700; margin-bottom: 25px; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
.cel-amount { font-size: 28px; font-weight: 800; background: rgba(255,255,255,0.15); padding: 15px 35px; border-radius: 40px; border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3); display: inline-block; }
.confetti { position: absolute; width: 12px; height: 12px; top: -20px; animation: fall linear forwards; z-index: 1; border-radius: 2px; }
@keyframes fall { to { transform: translateY(110vh) rotate(1080deg); opacity: 0; } }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; z-index: 200; animation: fadeIn .2s; }
.modal-sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 30px 30px 0 0; padding: 24px 20px calc(30px + var(--safe-bottom)); animation: slideUp .3s cubic-bezier(.1,.8,.3,1); max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideUp { from { transform: translateY(100%); } }
.modal-drag { width: 50px; height: 6px; background: #334155; border-radius: 10px; margin: 0 auto 20px; }
.toast { position: fixed; top: calc(var(--safe-top) + 20px); left: 50%; transform: translate(-50%, -100px); background: var(--surface-light); color: #fff; padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); transition: .3s cubic-bezier(.1,.8,.3,1); z-index: 500; opacity: 0; border: 1px solid rgba(255,255,255,0.1); max-width: 90vw; text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* ERROR SCREEN */
.error-screen { position: fixed; inset: 0; background: #0B1120; color: #EF4444; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; z-index: 9999; }
.error-screen h1 { font-size: 24px; margin-bottom: 10px; color: #EF4444; }
.error-screen p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
</style>
</head>

const money = n => 'Rs ' + Number(n||0).toLocaleString('en-US');
const todayISO = () => new Date().toISOString().slice(0,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shortName = s => { s = String(s||''); return s.length > 10 ? s.slice(0,9)+'…' : s; };
function fmtDate(s) { if(!s) return ''; const d = new Date(s+'T00:00:00'); return isNaN(d.getTime()) ? s : d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 2500);
}
function openModal(h) { modalHTML = h; render(); }
function closeModal(e) { if(e && e.target !== e.currentTarget) return; modalHTML = null; render(); }
function go(name, kametiId) {
  view = { name, kametiId: kametiId || null, tab: 'overview' };
  if(name !== 'kameti') teardownChannels();
  const c = document.getElementById('app-content');
  if(c) c.scrollTop = 0;

}
function setTab(tv) { view.tab = tv; render(); }
function toE164(p) {
  let x = p.replace(/[\s\-()]/g,'');
  if(x.startsWith('0')) x = '+92' + x.slice(1);
  if(!x.startsWith('+')) x = '+92' + x;
  return x;
}
function roundContribution(k) { return k.frequency === 'daily' ? k.amount * 30 : k.amount; }
function poolAmount(k) { const n = k.members.filter(m => m.status === 'approved').length; return roundContribution(k) * n; }

/* ============================================================
   AUTH
   ============================================================ */
async function sendOTP(phone) {
  if(!phone) return toast('Enter phone', 'error');
  try {
    const { error } = await supabase.auth.signInWithOtp({ phone: toE164(phone), options: { shouldCreateUser: true } });
    if(error) throw error;
    pendingPhone = phone;
    otpSent = true;
    render();
    toast('OTP Sent ✓', 'success');
  } catch(e) {
    toast(e.message || 'Failed to send OTP', 'error');
  }
}
async function verifyOTP(token) {
  if(!token) return toast('Enter OTP', 'error');
  try {
    const { error } = await supabase.auth.verifyOtp({ phone: toE164(pendingPhone), token, type: 'sms' });
    if(error) throw error;
    await loadProfile();
    await loadKametis();
    otpSent = false;
    go('dashboard');
    toast('Welcome!', 'success');
  } catch(e) {
    toast(e.message || 'Invalid OTP', 'error');
  }
}
async function loadProfile() {
  const { data: { user } } = await supabase.auth.getUser();
  if(!user) { currentUser = null; currentProfile = null; return; }
  currentUser = user;
  const { data, error } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  if(error) throw error;
  currentProfile = data;
}
async function logout() {
  if(!confirm('Logout?')) return;
  teardownChannels();
  await supabase.auth.signOut();
  currentUser = null; currentProfile = null; otpSent = false; pendingPhone = '';
  view = { name: 'dashboard' };
  render();
}

async function loadKametis() {
  if(!currentProfile) { kametis = []; return; }
  const { data } = await supabase.from('kametis').select('*').is('deleted_at', null).order('created_at', { ascending: false });
  kametis = data || [];
}
async function loadKametiDetail(id) {
  const { data: k, error } = await supabase.from('kametis').select('*').eq('id', id).single();
  if(error) throw error;
  const { data: m } = await supabase.from('members').select('*').eq('kameti_id', id);
  const { data: r } = await supabase.from('rounds').select('*').eq('kameti_id', id).order('index');
  const { data: c } = await supabase.from('contributions').select('*').in('round_id', (r || []).map(x => x.id));
  activeKameti = { ...k, members: m || [], rounds: (r || []).map(rr => ({ ...rr, contributions: (c || []).filter(cc => cc.round_id === rr.id) })) };
  return activeKameti;
}

function render() {
  try {
    updateLangUI();
    const app = document.getElementById('app-content');
    const wrapper = document.getElementById('app-wrapper');
    if(!app || !wrapper) return;

    // Handle auth state
    if(!currentProfile) {
      wrapper.classList.add('auth-mode');
      app.innerHTML = authView();
      return;
    }
    wrapper.classList.remove('auth-mode');
    
    // Show FAB for super admin
    const fab = document.getElementById('fab-create');
    if(fab) fab.style.display = currentProfile.role === 'superadmin' ? 'flex' : 'none';

    let body = '';
    switch(view.name) {
      case 'dashboard': body = dashboardView(); break;
      case 'create': body = createView(); break;
      case 'kameti': body = kametiView(view.kametiId); break;
      case 'profile': body = profileView(); break;
      default: body = dashboardView();
    }
    app.innerHTML = body + (modalHTML ? '<div class="modal-bg" onclick="closeModal(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="modal-drag"></div>' + modalHTML + '</div></div>' : '');

    // Highlight nav
    const nh = document.getElementById('nav-home');
    const np = document.getElementById('nav-profile');
    if(nh) nh.className = 'nav-item ' + ((view.name === 'dashboard' || view.name === 'kameti') ? 'on' : '');
    if(np) np.className = 'nav-item ' + (view.name === 'profile' ? 'on' : '');
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('app-content').innerHTML = '<div class="card"><h3 style="color:#EF4444">Render Error</h3><p class="page-sub">' + esc(e.message) + '</p></div>';
  }
}

async function createKameti(e) {
  e.preventDefault();
  const name = document.getElementById('k_name').value.trim();
  const freq = document.getElementById('k_freq').value;
  const amount = parseInt(document.getElementById('k_amt').value);
  const months = parseInt(document.getElementById('k_months').value);
  const spinDay = parseInt(document.getElementById('k_spinday').value);
  const startDate = document.getElementById('k_date').value;
  const adminInc = document.getElementById('k_admin_included').checked;
  let members = [];
  if(adminInc) members.push({ name: currentProfile.name, phone: currentProfile.phone, user_id: currentProfile.id });
  document.querySelectorAll('.m-name').forEach((inp, i) => {
    const n = inp.value.trim();
    const p = document.querySelectorAll('.m-phone')[i].value.trim().replace(/\s/g, '');
    if(n) members.push({ name: n, phone: p });
  });
  if(members.length < 2) return toast('Add at least 2 members', 'error');
  try {
    const code = Math.random().toString(36).substr(2, 6).toUpperCase();
    const { data: k, error } = await supabase.from('kametis').insert({
      name, code, owner_id: currentProfile.id, admin_ids: [currentProfile.id],
      frequency: freq, amount, total_months: months, spin_day: spinDay,
      start_date: startDate, status: 'active', admin_included: adminInc
    }).select().single();
    if(error) throw error;

    await supabase.from('members').insert(members.map(m => ({ kameti_id: k.id, user_id: m.user_id || null, name: m.name, phone: m.phone, status: 'approved' })));

    const rRows = [];
    for(let i = 0; i < months; i++) {
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + i);
      rRows.push({ kameti_id: k.id, index: i + 1, date: d.toISOString().slice(0,10), spin_state: 'pending' });
    }
    const { data: r } = await supabase.from('rounds').insert(rRows).select();
    const { data: m } = await supabase.from('members').select('id').eq('kameti_id', k.id);
    const cRows = [];
    (r || []).forEach(rr => (m || []).forEach(mm => cRows.push({ round_id: rr.id, member_id: mm.id, status: 'unpaid' })));
    if(cRows.length) await supabase.from('contributions').insert(cRows);

    await loadKametis();
    go('dashboard');
    toast('Kameti Created!', 'success');
  } catch(e) {
    toast(e.message, 'error');
  }
}

function spinTab(k, admin) {
  const approved = k.members.filter(m => m.status === 'approved');
  const pending = k.rounds.find(r => !r.receiver_member_id);
  const pool = approved.filter(m => !k.won_member_ids.includes(m.id));
  const display = pool.length ? pool : approved;
  const onlineCount = approved.filter(m => onlineMembers.some(o => o.user_id === m.user_id)).length;

  let html = '<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px"><span>ONLINE: ' + onlineCount + '/' + approved.length + '</span><span>POOL: ' + money(poolAmount(k)) + '</span></div><div class="presence-bar">' + approved.map(m => {
    const on = onlineMembers.some(o => o.user_id === m.user_id);
    return '<div class="p-chip ' + (on ? 'online' : '') + '">' + esc(m.name.split(' ')[0]) + '</div>';
  }).join('') + '</div></div>';

  if(pending) {
    const conic = display.map((m, i) => {
      const c = ['#10B981','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#14B8A6'][i % 6];
      const seg = 360 / display.length;
      return c + ' ' + (i * seg) + 'deg ' + ((i + 1) * seg) + 'deg';
    }).join(',');
    html += '<div class="card" style="background:transparent;box-shadow:none;border:none;padding:0"><div class="wheel-container"><div class="wheel" id="wheel" style="background:conic-gradient(' + conic + ')">' +
      display.map((m, i) => {
        const a = (i * (360 / display.length)) + ((360 / display.length) / 2);
        return '<div class="w-spoke" style="transform:rotate(' + (a - 180) + 'deg);height:115px"><span>' + esc(shortName(m.name)) + '</span></div>';
      }).join('') +
      '<div class="wheel-center">🎡</div></div><div class="wheel-pointer">▼</div></div>';
    if(isSpinning) html += '<div style="text-align:center;font-weight:800;color:var(--primary);font-size:18px">Spinning... (20s)</div>';
    else if(admin) html += '<button class="btn primary" style="margin-top:10px" onclick="doSpin(\'' + k.id + '\',\'' + pending.id + '\')">🎡 Start Spin</button>';
    else html += '<div style="text-align:center;font-size:13px;color:var(--text-muted)">Admin will spin soon</div>';
    html += '</div>';
  } else {
    html += '<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:50px;margin-bottom:15px;filter:drop-shadow(0 10px 10px rgba(0,0,0,0.5))">🏁</div><h3>All Spins Complete</h3></div>';
  }
  return html;
}
async function doSpin(kid, rid) {
  if(isSpinning) return;
  const k = activeKameti;
  try {
    const { data, error } = await supabase.rpc('spin_round', { p_round_id: rid });
    if(error) throw error;
    isSpinning = true;
    render();

    const seg = 360 / data.total;
    const target = 360 * 8 + (360 - (data.winner_index * seg + seg / 2));

    if(spinChannel) {
      try { spinChannel.send({ type: 'broadcast', event: 'spin_start', payload: { target, duration: SPIN_DURATION, roundId: rid } }); } catch(e) {}
    }
    setTimeout(() => {
      const el = document.getElementById('wheel');
      if(el) { el.style.transition = 'transform ' + SPIN_DURATION + 'ms cubic-bezier(.15,.7,.25,1)'; el.style.transform = 'rotate(' + target + 'deg)'; }
    }, 100);

    setTimeout(async () => {
      try {
        await supabase.rpc('complete_spin', { p_round_id: rid });
        if(spinChannel) {
          try { spinChannel.send({ type: 'broadcast', event: 'spin_result', payload: { winnerName: data.winner_name, poolAmt: poolAmount(k), roundId: rid } }); } catch(e) {}
        }
        isSpinning = false;
        if(!celebratedRounds.has(rid)) { celebratedRounds.add(rid); showCelebration(data.winner_name, poolAmount(k)); }
        await loadKametiDetail(kid);
        render();
      } catch(e) {
        isSpinning = false;
        toast(e.message, 'error');
        render();
      }
    }, SPIN_DURATION);
  } catch(e) {
    toast(e.message, 'error');
  }
}

function paymentsTab(k, admin) {
  let html = '<div class="card">';
  k.rounds.slice().reverse().forEach(r => {
    const rec = k.members.find(m => m.id === r.receiver_member_id);
    html += '<div style="padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05)"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px"><span>' + (rec ? '🏆 ' + esc(rec.name) : 'Spin Pending') + '</span><span style="color:var(--primary)">' + money(poolAmount(k)) + '</span></div><div style="font-size:12px;color:var(--text-muted);margin-top:4px">' + fmtDate(r.date) + '</div></div>';
  });
  return html + '</div>';
}
function settingsTab(k, admin) {
  if(!admin) return '<div class="card">Admin Only</div>';
  return '<div class="card"><h3 style="color:var(--danger);margin-bottom:15px">Danger Zone</h3><button class="btn danger" onclick="deleteModal(\'' + k.id + '\')">Delete Kameti</button></div>';
}

/* ============================================================
   ACTIONS
   ============================================================ */
function deleteModal(kid) {
  openModal('<h3 style="margin-bottom:10px;font-size:20px">Confirm Delete</h3><p style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Enter phone and name to move to trash.</p>' +
    '<div class="form-group"><label>Your Phone</label><input id="d_phone" type="tel" placeholder="03XXXXXXXXX"></div>' +
    '<div class="form-group"><label>Kameti Name</label><input id="d_name" placeholder="Exact name"></div>' +
    '<div style="display:flex;gap:10px"><button class="btn outline" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDel(\'' + kid + '\')">Delete</button></div>');
}
async function confirmDel(kid) {
  const p = document.getElementById('d_phone').value.trim();
  const n = document.getElementById('d_name').value.trim();
  try {
    await supabase.rpc('soft_delete_kameti', { p_kameti_id: kid, p_phone: p, p_name: n });
    modalHTML = null;
    await loadKametis();
    go('dashboard');
    toast('Deleted', 'success');
  } catch(e) {
    toast(e.message, 'error');
  }
}
async function removeMember(kid, mid) {
  if(!confirm('Remove?')) return;
  try {
    await supabase.from('members').delete().eq('id', mid);
    await loadKametiDetail(kid);
    render();
  } catch(e) { toast(e.message, 'error'); }
}

/* ============================================================
   CHANNELS
   ============================================================ */
function setupChannels(kametiId) {
  teardownChannels();
  try {
    const db = supabase.channel('db-' + kametiId).on('postgres_changes', { event: '*', schema: 'public', table: 'rounds', filter: 'kameti_id=eq.' + kametiId }, async () => {
      try { await loadKametiDetail(kametiId); render(); } catch(e) {}
    }).subscribe();

    presenceChannel = supabase.channel('p-' + kametiId, { config: { presence: { key: currentProfile.id } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      try {
        const s = presenceChannel.presenceState();
        const l = [];
        Object.values(s).forEach(a => a.forEach(p => { if(!l.find(x => x.user_id === p.user_id)) l.push(p); }));
        onlineMembers = l;
        if(view.tab === 'spin' || view.tab === 'members') render();
      } catch(e) {}
    }).subscribe(async (status) => {
      if(status === 'SUBSCRIBED') {
        try { await presenceChannel.track({ user_id: currentProfile.id, name: currentProfile.name }); } catch(e) {}
      }
    });

    spinChannel = supabase.channel('s-' + kametiId);
    spinChannel.on('broadcast', { event: 'spin_start' }, ({ payload }) => {
      isSpinning = true;
      render();
      setTimeout(() => {
        const el = document.getElementById('wheel');
        if(el) { el.style.transition = 'transform ' + payload.duration + 'ms cubic-bezier(.15,.7,.25,1)'; el.style.transform = 'rotate(' + payload.target + 'deg)'; }
      }, 100);
    }).on('broadcast', { event: 'spin_result' }, async ({ payload }) => {
      if(!celebratedRounds.has(payload.roundId)) { celebratedRounds.add(payload.roundId); showCelebration(payload.winnerName, payload.poolAmt); }
      isSpinning = false;
      try { await loadKametiDetail(kametiId); render(); } catch(e) {}
    }).subscribe();

    realtimeSub = () => {
      try {
        supabase.removeChannel(db);
        if(presenceChannel) supabase.removeChannel(presenceChannel);
        if(spinChannel) supabase.removeChannel(spinChannel);
      } catch(e) {}
    };
  } catch(e) {
    console.warn('Channel setup error:', e);
  }
}
function teardownChannels() {
  if(realtimeSub) { realtimeSub(); realtimeSub = null; }
  onlineMembers = [];
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function showCelebration(name, amt) {
  const ov = document.createElement('div');
  ov.className = 'celebration';
  ov.innerHTML = '<div class="cel-content"><div class="cel-emoji">🎉</div><div class="cel-title">' + t('khushNaseeb') + '</div><div class="cel-name">' + esc(name) + '</div><div class="cel-msg">' + t('mubarak') + '<br><span style="font-size:16px">' + t('apkiKameti') + '</span></div><div class="cel-amount">' + money(amt) + '</div></div>';
  document.body.appendChild(ov);
  for(let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = ['#FBBF24','#F59E0B','#EF4444','#3B82F6','#10B981','#8B5CF6','#fff'][i % 7];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    ov.appendChild(c);
  }
  try {
    const u = new SpeechSynthesisUtterance(name + ' آپ کو مبارک ہو، آپ کی کمیٹی نکل آئی ہے');
    u.lang = 'ur-PK';
    u.rate = 0.85;
    u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch(e) { console.warn('TTS error:', e); }
  setTimeout(() => {
    ov.style.opacity = '0';
    ov.style.transition = 'opacity .5s';
    setTimeout(() => ov.remove(), 500);
  }, 8000);
}

function profileView() {
  return '<h1 class="page-title">Profile</h1><p class="page-sub">Manage your account</p>' +
    '<div class="card" style="text-align:center"><div class="m-avatar" style="width:80px;height:80px;font-size:30px;margin:0 auto 16px;background:linear-gradient(145deg,#10B981,#059669);color:#fff;box-shadow:0 10px 20px rgba(16,185,129,0.4)">' + esc(currentProfile.name.charAt(0)) + '</div>' +
    '<h2 style="font-size:22px;font-weight:800">' + esc(currentProfile.name) + '</h2><p style="color:var(--text-muted);font-size:14px;margin-top:4px">' + esc(currentProfile.phone) + '</p>' +
    '<span class="k-badge active" style="display:inline-block;margin-top:12px">' + currentProfile.role + '</span></div>' +
    '<button class="btn danger" onclick="logout()">' + t('logout') + '</button>';
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  try {
    const { data: { session }, error } = await supabase.auth.getSession();
    if(error) console.warn('Session error:', error);
    if(session) {
      try {
        await loadProfile();
        await loadKametis();
      } catch(e) {
        console.error('Profile load failed:', e);
        currentProfile = null;
      }
    }
  } catch(e) {
    console.error('Init error:', e);
  }
  // Hide loading, show app
  const loading = document.getElementById('loading');
  if(loading) loading.style.display = 'none';
  render();
}

// Boot up
waitForSupabase(() => {
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.documentElement.lang = lang;
    document.body.dir = lang === 'ur' ? 'rtl' : 'ltr';
    if('speechSynthesis' in window) speechSynthesis.getVoices();
    init();
  } catch(e) {
    showFatalError('Failed to initialize: ' + e.message);
  }
});
</script>
